  <desc id="svg-desc-english-g3-m01-d11-visual">Illustration for Be-Verb Team · M01 D11. Choose am, is, are, was, or were to agree with the subject and time. Tap each sentence and say the be-verb out loud. It shows: I am ready., They are reading., She was here yesterday..</desc>
