  <title id="svg-title-filipino-g3-m01-d06-visual">Lesson visual: Sundin ang Panuto</title>
  <desc id="svg-desc-filipino-g3-m01-d06-visual">Illustration for Sundin ang Panuto. Sundin ang malinaw na panutong may dalawa hanggang apat na hakbang. Suriin ang bawat halimbawa at basahin ang mga halimbawa. It shows: Una: kunin ang papel., Ikalawa: gumuhit ng bilog., Huli: kulayan ang bilog..</desc>
