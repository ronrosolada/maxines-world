  <title id="svg-title-english-g3-q1-w02-d04-visual">Lesson visual: Short-Vowel Sound Lab</title>
  <desc id="svg-desc-english-g3-q1-w02-d04-visual">Illustration for Short-Vowel Sound Lab. Hear and say the short vowel sounds: a, e, i, o, u. Tap each word and say its short vowel sound! It shows: apple (a), egg (e), igloo (i), octopus (o), umbrella (u), cat (a), bed (e), fish (i).</desc>
