  <title id="svg-title-science-g3-q3-w05-d03-visual">Lesson visual: Chalk Detective</title>
  <desc id="svg-desc-science-g3-q3-w05-d03-visual">Illustration for Chalk Detective. Describe the observable properties of chalk and choose its safe use or handling. Tap each object and notice the property Milo describes. It shows: a rubber duck floats in water, a clay pot feels heavy, a silk ribbon feels smooth, chalk leaves a soft dusty mark.</desc>
