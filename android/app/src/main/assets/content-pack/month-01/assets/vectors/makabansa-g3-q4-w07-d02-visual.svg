<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="svg-title-makabansa-g3-q4-w07-d02-visual svg-desc-makabansa-g3-q4-w07-d02-visual">
  <title id="svg-title-makabansa-g3-q4-w07-d02-visual">Lesson visual: Pamumuhay sa Bukid</title>
  <desc id="svg-desc-makabansa-g3-q4-w07-d02-visual">Illustration for Pamumuhay sa Bukid. Naipaliliwanag kung paano nakaaapekto ang bukid sa kultura at pamumuhay ng komunidad. Hanapin sa larawan ang mga gawaing kaugnay ng bukid. It shows: pagtatanim ng palay sa basang lupa, pag-aani ng gulay sa umaga, paggamit ng kawayan sa bakod ng taniman, paghahatid ng ani sa pamilihan.</desc>
