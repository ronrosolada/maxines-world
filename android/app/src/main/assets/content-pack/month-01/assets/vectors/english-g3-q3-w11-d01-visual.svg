  <title id="svg-title-english-g3-q3-w11-d01-visual">Lesson visual: Neighborhood Sentences</title>
  <desc id="svg-desc-english-g3-q3-w11-d01-visual">Illustration for Neighborhood Sentences. Use a capital letter and correct end punctuation in neighborhood sentences. Tap neighborhood sentences that are polished and ready. It shows: Ana helps her neighbor., Can you pass the ball?, Please watch the step!, Our class plants seeds..</desc>
