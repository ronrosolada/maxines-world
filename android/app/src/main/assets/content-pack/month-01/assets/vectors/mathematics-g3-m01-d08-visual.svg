  <title id="svg-title-mathematics-g3-m01-d08-visual">Lesson visual: Philippine Money Market</title>
  <desc id="svg-desc-mathematics-g3-m01-d08-visual">Illustration for Philippine Money Market. Read and compare schematic peso and centavo amounts. Tap each example and read the money amount. It shows: ₱5.00 is five pesos, 100 centavos = ₱1.00, ₱12.50 &gt; ₱12.05.</desc>
