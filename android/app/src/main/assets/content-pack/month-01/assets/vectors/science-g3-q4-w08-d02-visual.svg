  <title id="svg-title-science-g3-q4-w08-d02-visual">Lesson visual: Horse and Rose</title>
  <desc id="svg-desc-science-g3-q4-w08-d02-visual">Illustration for Horse and Rose. Classify a horse and a rose as living things and describe a basic need or body part. Tap each example and look for evidence of life. It shows: a horse grows and responds to sounds, a rose grows leaves and needs water, a fish needs water to live, a key stays on a table.</desc>
