<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="svg-title-makabansa-g3-q4-w07-d04-visual svg-desc-makabansa-g3-q4-w07-d04-visual">
  <title id="svg-title-makabansa-g3-q4-w07-d04-visual">Lesson visual: Pamumuhay sa Lawa</title>
  <desc id="svg-desc-makabansa-g3-q4-w07-d04-visual">Illustration for Pamumuhay sa Lawa. Naipaliliwanag kung paano nakaaapekto ang lawa sa kultura at pamumuhay ng komunidad. Hanapin sa larawan ang mga gawaing kaugnay ng lawa. It shows: naghuhuli ng isda mula sa bangka, nagtatawid ng tao sa kabilang pampang, nagtutuyo ng isda sa araw, naghahatid ng pagkain sa pamamagitan ng bangka.</desc>
