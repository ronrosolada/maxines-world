  <title id="svg-title-filipino-g3-q4-w11-d04-visual">Lesson visual: Celia ay Naglilinis ng silid</title>
  <desc id="svg-desc-filipino-g3-q4-w11-d04-visual">Illustration for Celia ay Naglilinis ng silid. Natutukoy ang simuno at panaguri sa pangungusap na 'Si Celia  ay naglilinis ng silid.' Basahin ang bawat pangungusap at tukuyin ang simuno at panaguri. It shows: Si Celia / ay naglilinis ng silid., Ang simbahan / ay umaalingawngaw., Si Dodoy / ay sumisipol., Ang ilog / ay umaagos..</desc>
