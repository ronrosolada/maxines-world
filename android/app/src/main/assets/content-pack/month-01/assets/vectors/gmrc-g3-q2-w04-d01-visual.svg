  <title id="svg-title-gmrc-g3-q2-w04-d01-visual">Lesson visual: Paggalang sa Kapwa · Q2 W04 D01</title>
  <desc id="svg-desc-gmrc-g3-q2-w04-d01-visual">Illustration for Paggalang sa Kapwa · Q2 W04 D01. Naipakikita ang paggalang sa salita, kilos, at pakikinig sa kapwa. Hanapin sa larawan ang mga halimbawa ng paggalang sa kapwa. It shows: nakikinig, nagsasabi ng po at opo kung angkop, humihingi ng pahintulot, gumagalang sa pagkakaiba.</desc>
