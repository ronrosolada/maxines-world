  <title id="svg-title-filipino-g3-q4-w15-d01-visual">Lesson visual: Talata: Si Jose</title>
  <desc id="svg-desc-filipino-g3-q4-w15-d01-visual">Illustration for Talata: Si Jose. Nakabubuo ng maikling talata tungkol kay Jose na malinaw ang paksa at mga detalye. Basahin ang mga bahagi at tukuyin ang papel ng bawat isa. It shows: si Jose, Maaga gumigising si Jose para mag-ehersisyo., Tumatakbo siya sa parke kasama ang kanyang kuya., Malusog at masigla siya araw-araw..</desc>
