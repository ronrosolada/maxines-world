  <desc id="svg-desc-filipino-g3-q3-w09-d05-visual">Illustration for Magagalang na Pananalita · Q3 W09 D05. Nagagamit ang magagalang na pagbati at pananalita ayon sa sitwasyon. Tuklasin ang mga magalang na pahayag. Isipin kung kailan ito ginagamit. It shows: Magandang gabi po., Makikiraan po ba?, Maraming salamat po., Pasensiya na po..</desc>
