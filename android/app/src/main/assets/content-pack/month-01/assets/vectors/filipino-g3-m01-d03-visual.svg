  <desc id="svg-desc-filipino-g3-m01-d03-visual">Illustration for Sagot Mula sa Teksto. Sagutin ang sino, ano, saan, kailan, at bakit mula sa binasa. Tingnan kung aling tanong ang sinasagot ng bawat detalye. It shows: Sino—tauhan, Saan—lugar, Kailan—oras o panahon.</desc>
