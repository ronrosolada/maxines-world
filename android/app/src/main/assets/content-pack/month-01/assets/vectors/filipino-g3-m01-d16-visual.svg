  <title id="svg-title-filipino-g3-m01-d16-visual">Lesson visual: Ang Angkop na Wakas</title>
  <desc id="svg-desc-filipino-g3-m01-d16-visual">Illustration for Ang Angkop na Wakas. Pumili ng wakas na suportado ng mga pahiwatig sa kuwento. Basahin ang pahiwatig at posibleng wakas. It shows: Nahanap ang susi matapos hanapin sa mesa., Nabuhay ang halaman matapos diligan., Naibalik ang aklat matapos makita..</desc>
