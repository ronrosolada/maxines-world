  <title id="svg-title-filipino-g3-q1-w02-d03-visual">Lesson visual: Lola ay Nagbabasa ng pahayagan</title>
  <desc id="svg-desc-filipino-g3-q1-w02-d03-visual">Illustration for Lola ay Nagbabasa ng pahayagan. Natutukoy ang simuno at panaguri sa pangungusap na 'Si Lola  ay nagbabasa ng pahayagan.' Basahin ang mga halimbawa at markahan ang hati. It shows: Si Lola / ay nagbabasa ng pahayagan., Ang mga ibon / ay umaawit., Si Ben / ay sumasayaw., Ang pusa / ay natutulog..</desc>
