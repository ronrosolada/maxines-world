  <title id="svg-title-english-g3-q2-w01-d04-visual">Lesson visual: Delicious, Eager, Fresh</title>
  <desc id="svg-desc-english-g3-q2-w01-d04-visual">Illustration for Delicious, Eager, Fresh. Use the words delicious, eager, and fresh in context with sentence clues. Tap each sentence that gives a clue for delicious, eager, or fresh. It shows: Mama cooks delicious adobo for us., The children are eager to open their new books., Fresh mangoes smell sweet., The patient fisherman waited for a bite..</desc>
