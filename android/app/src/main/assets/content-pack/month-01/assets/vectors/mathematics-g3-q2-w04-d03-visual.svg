  <title id="svg-title-mathematics-g3-q2-w04-d03-visual">Lesson visual: Round 47 to 50 Review</title>
  <desc id="svg-desc-mathematics-g3-q2-w04-d03-visual">Illustration for Round 47 to 50 Review. Round numbers to the nearest ten, hundred, or thousand. Tap a number and point to the digit that decides its rounding. It shows: 47 → 50 (ones digit 7), 342 → 300 (tens digit 4), 3,650 → 4,000 (hundreds digit 6), 1,241 → 1,200 (tens digit 4).</desc>
