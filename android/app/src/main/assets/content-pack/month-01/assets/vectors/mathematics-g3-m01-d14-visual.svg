  <desc id="svg-desc-mathematics-g3-m01-d14-visual">Illustration for Equal Groups and Facts. Model multiplication with equal groups and arrays. Tap each example and count the groups. It shows: 3×4=12, 4 rows of 2=8, 5 groups of 3=15.</desc>
