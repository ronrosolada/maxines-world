  <title id="svg-title-gmrc-g3-q1-w01-d01-visual">Lesson visual: Tiwala sa Sarili</title>
  <desc id="svg-desc-gmrc-g3-q1-w01-d01-visual">Illustration for Tiwala sa Sarili. Naipakikita ang tiwala sa sarili habang kinikilala ang sariling lakas at limitasyon. Hanapin sa larawan ang mga halimbawa ng tiwala sa sarili. It shows: sumubok ng bagong gawain, nagsanay, humingi ng gabay, pinahalagahan ang sariling progreso.</desc>
