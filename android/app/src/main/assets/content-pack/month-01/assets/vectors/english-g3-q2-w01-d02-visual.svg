  <title id="svg-title-english-g3-q2-w01-d02-visual">Lesson visual: Gentle, Clever, Cozy</title>
  <desc id="svg-desc-english-g3-q2-w01-d02-visual">Illustration for Gentle, Clever, Cozy. Use the words gentle, clever, and cozy in context with sentence clues. Tap each sentence that gives a clue for gentle, clever, or cozy. It shows: Milo gives the puppy a gentle pat., The clever fox found a way to reach the grapes., The kitten sleeps in a cozy basket., The rabbit likes to nibble on carrots..</desc>
