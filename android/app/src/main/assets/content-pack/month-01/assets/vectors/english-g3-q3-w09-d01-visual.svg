  <desc id="svg-desc-english-g3-q3-w09-d01-visual">Illustration for Roots: Look, Paint, Fast. Identify the base words look, paint, and fast in common related words. Tap each pair that keeps the same base word. It shows: look — looked, paint — painter, fast — faster, look — looking.</desc>
