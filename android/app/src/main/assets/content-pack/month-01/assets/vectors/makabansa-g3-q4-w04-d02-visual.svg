  <title id="svg-title-makabansa-g3-q4-w04-d02-visual">Lesson visual: Ritmo at Awit ng Komunidad</title>
  <desc id="svg-desc-makabansa-g3-q4-w04-d02-visual">Illustration for Ritmo at Awit ng Komunidad. Naiuugnay ang ritmo at tunog sa sining at kultura ng komunidad. Hanapin ang palakpak, tugon, tambol, at awiting-bayan. It shows: palakpak na paulit-ulit, salitang sinasagot ng pangkat, tunog ng tambol sa pista, awiting-bayan ng komunidad.</desc>
