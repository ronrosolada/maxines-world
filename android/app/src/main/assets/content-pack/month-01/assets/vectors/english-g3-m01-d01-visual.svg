  <desc id="svg-desc-english-g3-m01-d01-visual">Illustration for Picture Detective · M01 D01. Describe people, places, objects, and actions using evidence from a picture. Tap each example and read what you can see! It shows: The child holds a red kite., Two birds sit in the tree., A dog runs beside the bench..</desc>
