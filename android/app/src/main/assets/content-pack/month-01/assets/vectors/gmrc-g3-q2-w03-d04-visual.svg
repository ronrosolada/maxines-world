  <title id="svg-title-gmrc-g3-q2-w03-d04-visual">Lesson visual: Magalang sa Plasa</title>
  <desc id="svg-desc-gmrc-g3-q2-w03-d04-visual">Illustration for Magalang sa Plasa. Naipakikita ang paggalang sa salita, kilos, at pakikinig sa kapwa sa plasa. Hanapin ang pakikinig, magalang na salita, pahintulot, at pagbibigay-daan. It shows: nakikinig sa kausap, nagsasabi ng po at opo kung angkop, humihingi ng pahintulot bago gumamit, nagbibigay-daan sa naglalakad.</desc>
