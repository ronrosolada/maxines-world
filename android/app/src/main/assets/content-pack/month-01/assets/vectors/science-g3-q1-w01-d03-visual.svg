  <title id="svg-title-science-g3-q1-w01-d03-visual">Lesson visual: Stone Detective</title>
  <desc id="svg-desc-science-g3-q1-w01-d03-visual">Illustration for Stone Detective. Describe the observable properties of a stone and choose its safe use or handling. Tap each object and notice the property Milo describes. It shows: a glass jar lets light pass through, a cotton cloth feels soft, a sponge soaks up water, a stone stays firm and is heavy.</desc>
