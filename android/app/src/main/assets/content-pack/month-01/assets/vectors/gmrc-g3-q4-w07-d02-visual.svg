  <title id="svg-title-gmrc-g3-q4-w07-d02-visual">Lesson visual: Paggalang sa Kapwa · Q4 W07 D02</title>
  <desc id="svg-desc-gmrc-g3-q4-w07-d02-visual">Illustration for Paggalang sa Kapwa · Q4 W07 D02. Naipakikita ang paggalang sa salita, kilos, at pakikinig sa kapwa. Hanapin sa larawan ang mga halimbawa ng paggalang sa kapwa. It shows: nakikinig, nagsasabi ng po at opo kung angkop, humihingi ng pahintulot, gumagalang sa pagkakaiba.</desc>
