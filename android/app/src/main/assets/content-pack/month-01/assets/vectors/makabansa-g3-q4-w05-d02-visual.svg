<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="svg-title-makabansa-g3-q4-w05-d02-visual svg-desc-makabansa-g3-q4-w05-d02-visual">
  <title id="svg-title-makabansa-g3-q4-w05-d02-visual">Lesson visual: Pamumuhay sa Lambak</title>
  <desc id="svg-desc-makabansa-g3-q4-w05-d02-visual">Illustration for Pamumuhay sa Lambak. Naipaliliwanag kung paano nakaaapekto ang lambak sa kultura at pamumuhay ng komunidad. Hanapin ang mga larawang nagpapakita ng buhay sa lambak. It shows: Bukid sa mababang lupain sa pagitan ng bundok, Sapa na nagdidilig sa gulayan, Daan na sumusunod sa gilid ng lambak, Pamilihang nagbebenta ng ani mula sa lambak.</desc>
