  <title id="svg-title-science-g3-q3-w06-d01-visual">Lesson visual: Light and Sound Lab · Q3 W06 D01</title>
  <desc id="svg-desc-science-g3-q3-w06-d01-visual">Illustration for Light and Sound Lab · Q3 W06 D01. Describe how light and sound behave and identify safe ways to protect people. Explore each example. clapping hands makes sound. a lamp lights a dark room. It shows: clapping hands makes sound, a lamp lights a dark room, cover your ears at a very loud concert, do not point a laser at your eyes.</desc>
