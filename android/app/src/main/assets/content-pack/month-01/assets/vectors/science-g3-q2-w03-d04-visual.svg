  <title id="svg-title-science-g3-q2-w03-d04-visual">Lesson visual: Ant and Duck</title>
  <desc id="svg-desc-science-g3-q2-w03-d04-visual">Illustration for Ant and Duck. Classify an ant and a duck as living things and describe a basic need or body part. Tap each example and look for evidence of life. It shows: an ant grows and carries food, a duck swims and needs water, a bird uses wings to fly, a chair stays in one place.</desc>
