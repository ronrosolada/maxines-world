  <title id="svg-title-gmrc-g3-q1-w01-d02-visual">Lesson visual: Magalang sa Komunidad</title>
  <desc id="svg-desc-gmrc-g3-q1-w01-d02-visual">Illustration for Magalang sa Komunidad. Naipakikita ang paggalang sa salita, kilos, at pakikinig sa kapwa sa komunidad. Hanapin sa larawan ang pakikinig, magalang na salita, pahintulot, at pagtanggap. It shows: nakikinig, nagsasabi ng po at opo kung angkop, humihingi ng pahintulot, gumagalang sa pagkakaiba.</desc>
