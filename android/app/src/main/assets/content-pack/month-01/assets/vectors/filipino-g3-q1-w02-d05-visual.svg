  <title id="svg-title-filipino-g3-q1-w02-d05-visual">Lesson visual: Ben ay Sumasayaw</title>
  <desc id="svg-desc-filipino-g3-q1-w02-d05-visual">Illustration for Ben ay Sumasayaw. Natutukoy ang simuno at panaguri sa pangungusap na 'Si Ben  ay sumasayaw.' Basahin ang mga halimbawa at markahan ang hati. It shows: Si Ben / ay sumasayaw., Ang pusa / ay natutulog., Si Liza / ay kumakanta., Ang mga mag-aaral / ay nag-aaral..</desc>
