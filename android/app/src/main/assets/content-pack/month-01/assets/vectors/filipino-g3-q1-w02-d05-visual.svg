  <title id="svg-title-filipino-g3-q1-w02-d05-visual">Lesson visual: Bahagi ng Pangungusap · Q1 W02 D05</title>
  <desc id="svg-desc-filipino-g3-q1-w02-d05-visual">Illustration for Bahagi ng Pangungusap · Q1 W02 D05. Natutukoy ang simuno at panaguri sa payak na pangungusap. Tuklasin ang mga halimbawa. Hanapin ang simuno at panaguri. Magsimula sa 'Si Ben / ay sumasayaw.'. It shows: Si Ben / ay sumasayaw., Ang pusa / ay natutulog., Si Liza / ay kumakanta., Ang mga mag-aaral / ay nag-aaral..</desc>
