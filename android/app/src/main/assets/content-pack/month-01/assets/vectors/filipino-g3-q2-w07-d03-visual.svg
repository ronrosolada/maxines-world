  <title id="svg-title-filipino-g3-q2-w07-d03-visual">Lesson visual: Buod: Si Ben at ang Mainit na Araw</title>
  <desc id="svg-desc-filipino-g3-q2-w07-d03-visual">Illustration for Buod: Si Ben at ang Mainit na Araw. Nakabubuo ng maikling buod ng kuwentong 'Si Ben at ang Mainit na Araw'. Basahin ang kuwento at tukuyin ang mahahalagang bahagi. It shows: Ben, Gustong maglaro ni Ben pero mainit ang araw., Naghintay siya hanggang hapon., Naglaro siya nang masaya sa labas..</desc>
