  <desc id="svg-desc-english-g3-q1-w01-d03-visual">Illustration for Choose an Ending. Pick a possible ending for a story. Tap each possible ending for the little duck's story! It shows: The duck finds its mother, A kind boy helps the duck, The duck swims home, The duck makes new friends, The duck sleeps on a lily pad, The moon guides the duck home.</desc>
