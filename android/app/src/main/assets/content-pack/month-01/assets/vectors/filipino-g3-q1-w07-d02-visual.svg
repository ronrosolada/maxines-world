<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="svg-title-filipino-g3-q1-w07-d02-visual svg-desc-filipino-g3-q1-w07-d02-visual">
  <title id="svg-title-filipino-g3-q1-w07-d02-visual">Lesson visual: Panghalip na Pamatlig (Ito, Iyan, Iyon)</title>
  <desc id="svg-desc-filipino-g3-q1-w07-d02-visual">Illustration for Panghalip na Pamatlig (Ito, Iyan, Iyon). Nakagagamit ng panghalip na pamatlig — ito, iyan, at iyon — bilang pamalit sa pangngalan. Hanapin ang mga sitwasyong nagpapakita ng layo o lapit. It shows: Hawak mo ang lapis, Nasa tabi mo ang bag, Nasa malayong puno ang ibon, Bitbit mo ang tsokolate, Nasa kabilang kalsada ang aso.</desc>
