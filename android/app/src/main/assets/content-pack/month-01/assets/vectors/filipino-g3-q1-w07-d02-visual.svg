  <title id="svg-title-filipino-g3-q1-w07-d02-visual">Lesson visual: Panghalip na Pamatlig (Ito, Iyan, Iyon)</title>
  <desc id="svg-desc-filipino-g3-q1-w07-d02-visual">Illustration for Panghalip na Pamatlig (Ito, Iyan, Iyon). Nakagagamit ng panghalip na pamatlig — ito, iyan, at iyon — bilang pamalit sa pangngalan. Tuklasin ang mga halimbawang kaugnay ng Panghalip na Pamatlig. It shows: Hawak mo ang lapis, Nasa tabi mo ang bag, Nasa malayong puno ang ibon, Bitbit mo ang tsokolate, Nasa kabilang kalsada ang aso.</desc>
