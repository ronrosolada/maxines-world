  <title id="svg-title-filipino-g3-q1-w08-d01-visual">Lesson visual: Pagbuo ng Kuwento</title>
  <desc id="svg-desc-filipino-g3-q1-w08-d01-visual">Illustration for Pagbuo ng Kuwento. Natutukoy ang simula, gitna, at wakas ng kuwento at naiaayos ang mga hakbang sa pagbuo nito. Tuklasin ang mga halimbawang kaugnay ng Pagbuo ng Kuwento. It shows: Tauhan, Tagpuan, Suliranin, Solusyon, Aral.</desc>
