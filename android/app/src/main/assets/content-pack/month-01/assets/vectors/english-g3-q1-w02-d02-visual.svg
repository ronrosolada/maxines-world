  <desc id="svg-desc-english-g3-q1-w02-d02-visual">Illustration for More Than One. Make plural nouns by adding -s. Tap each PLURAL word (more than one) you can find! It shows: apples, cats, mangoes, tables, books, stars, flowers, chairs.</desc>
