<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="svg-title-araling-panlipunan-g3-m01-d04-visual svg-desc-araling-panlipunan-g3-m01-d04-visual">
  <title id="svg-title-araling-panlipunan-g3-m01-d04-visual">Lesson visual: Paano Hinuhubog ng Anyong Lupa ang Lalawigan</title>
  <desc id="svg-desc-araling-panlipunan-g3-m01-d04-visual">Illustration for Paano Hinuhubog ng Anyong Lupa ang Lalawigan. Kilalanin ang kapatagan, bundok, lambak, baybayin, at talampas. Hanapin ang mataas, mababa, patag, at katabing-dagat na anyong lupa. It shows: Bundok na mataas ang tuktok., Lupang mababa sa pagitan ng dalawang bundok., Lupang katabi ng dagat..</desc>
