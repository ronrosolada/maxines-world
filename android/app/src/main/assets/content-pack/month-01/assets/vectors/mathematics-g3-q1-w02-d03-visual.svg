  <title id="svg-title-mathematics-g3-q1-w02-d03-visual">Lesson visual: Number Face-Off</title>
  <desc id="svg-desc-mathematics-g3-q1-w02-d03-visual">Illustration for Number Face-Off. Compare numbers up to 10,000 using =, &gt;, and &lt;. Tap each example and read the comparison. It shows: 4,205 &gt; 4,025, 3,100 &lt; 3,900, 6,450 = 6,450, 8,001 &gt; 7,999.</desc>
