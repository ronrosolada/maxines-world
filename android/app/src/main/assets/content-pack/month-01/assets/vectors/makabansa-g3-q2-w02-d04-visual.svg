  <title id="svg-title-makabansa-g3-q2-w02-d04-visual">Lesson visual: Pamumuhay sa Kabundukan</title>
  <desc id="svg-desc-makabansa-g3-q2-w02-d04-visual">Illustration for Pamumuhay sa Kabundukan. Naipaliliwanag kung paano nakaaapekto ang kabundukan sa kultura at pamumuhay ng komunidad. Hanapin ang taniman, bahay, ani, at disenyong angkop sa bundok. It shows: pagsasaka sa gilid ng bundok, hagdan-hagdang taniman, bahay na angkop sa malamig na klima, pagkain mula sa lokal na ani.</desc>
