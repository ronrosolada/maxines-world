  <title id="svg-title-mathematics-g3-q2-w04-d01-visual">Lesson visual: Adding 573 and 248</title>
  <desc id="svg-desc-mathematics-g3-q2-w04-d01-visual">Illustration for Adding 573 and 248. Add 573 and 248 using place value, with or without regrouping. Tap each fish example and follow the place-value addition. It shows: 573 + 248 = 821 fish, 1,905 + 2,995 = 4,900 fish, 10 ones trade for 1 ten, round the addends to estimate.</desc>
