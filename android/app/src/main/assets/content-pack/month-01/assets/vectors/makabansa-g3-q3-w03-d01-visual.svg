  <title id="svg-title-makabansa-g3-q3-w03-d01-visual">Lesson visual: Kilala Ko ang Aking Pagkakakilanlan</title>
  <desc id="svg-desc-makabansa-g3-q3-w03-d01-visual">Illustration for Kilala Ko ang Aking Pagkakakilanlan. Naipaliliwanag kung bakit kailangang malaman ng bawat bata ang kaniyang pagkakakilanlang Pilipino. Hanapin ang wika, pamilya, komunidad, at kasaysayan sa larawan. It shows: paggalang sa kapwa, pag-aalaga sa komunidad, paggamit ng sariling wika, pag-alala sa kasaysayan ng pamilya.</desc>
