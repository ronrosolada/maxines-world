  <title id="svg-title-science-g3-q4-w09-d01-visual">Lesson visual: Rainbows Bend Light</title>
  <desc id="svg-desc-science-g3-q4-w09-d01-visual">Illustration for Rainbows Bend Light. Describe how a rainbow appears when light bends and how to protect our eyes. Tap each example and notice what light does. It shows: raindrops bend sunlight into rainbow colors, a prism spreads white light into colors, a rainbow shows separated colors, look away from a very bright light.</desc>
