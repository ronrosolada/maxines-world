  <title id="svg-title-filipino-g3-q1-w04-d01-visual">Lesson visual: Pagbabaybay nang Wasto ng mga Salita</title>
  <desc id="svg-desc-filipino-g3-q1-w04-d01-visual">Illustration for Pagbabaybay nang Wasto ng mga Salita. Nakababaybay nang wasto ng mga salitang natutuhan sa aralin at mga salitang di-kilala batay sa bigkas (F3PY-Id-2.2). Tuklasin ang mga halimbawang kaugnay ng Pagbabaybay nang Wasto ng mga Salita. It shows: tsubibo, kalupi, batobalani, antipara.</desc>
