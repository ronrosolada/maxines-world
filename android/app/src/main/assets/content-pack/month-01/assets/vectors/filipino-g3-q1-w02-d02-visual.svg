  <title id="svg-title-filipino-g3-q1-w02-d02-visual">Lesson visual: Tatay ay Nagmamaneho</title>
  <desc id="svg-desc-filipino-g3-q1-w02-d02-visual">Illustration for Tatay ay Nagmamaneho. Natutukoy ang simuno at panaguri sa pangungusap na 'Si Tatay  ay nagmamaneho.' Basahin ang mga halimbawa at markahan ang hati. It shows: Si Tatay / ay nagmamaneho., Ang bibe / ay lumalangoy sa lawa., Si Lola / ay nagbabasa ng pahayagan., Ang mga ibon / ay umaawit..</desc>
