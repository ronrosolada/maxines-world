  <title id="svg-title-gmrc-g3-q1-w01-d05-visual">Lesson visual: Disiplina sa Araw-araw</title>
  <desc id="svg-desc-gmrc-g3-q1-w01-d05-visual">Illustration for Disiplina sa Araw-araw. Naipakikita ang disiplina sa pagsunod sa makatarungan at ligtas na tuntunin. Hanapin sa larawan ang mga halimbawa ng disiplina sa pagsunod sa tuntunin. It shows: pumipila, naghihintay ng turn, naglalakad sa tamang lugar, nagliligpit pagkatapos gamitin.</desc>
