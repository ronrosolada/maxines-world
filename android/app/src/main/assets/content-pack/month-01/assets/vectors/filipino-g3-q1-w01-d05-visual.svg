  <title id="svg-title-filipino-g3-q1-w01-d05-visual">Lesson visual: Ugat ng 'Sumulat'</title>
  <desc id="svg-desc-filipino-g3-q1-w01-d05-visual">Illustration for Ugat ng 'Sumulat'. Natutukoy ang salitang-ugat ng 'sumulat' at ng mga katulad na salita. Hanapin ang salitang-ugat sa bawat halimbawa. It shows: sulat → sumulat, laro → naglaro, basa → bumasa, tanim → nagtanim.</desc>
