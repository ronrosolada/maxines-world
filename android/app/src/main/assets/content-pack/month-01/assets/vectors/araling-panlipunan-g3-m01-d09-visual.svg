  <title id="svg-title-araling-panlipunan-g3-m01-d09-visual">Lesson visual: Pagsisiyasat sa Mapa ng Kapaligiran</title>
  <desc id="svg-desc-araling-panlipunan-g3-m01-d09-visual">Illustration for Pagsisiyasat sa Mapa ng Kapaligiran. Pagsamahin ang anyong-lupa, anyong-tubig, yaman, populasyon, at patong ng panganib ng kathang-isip na mapa. Suriin ang bawat halimbawa at basahin ang mga halimbawa. It shows: ilog at patong ng paninirahan, patong ng elebasyon at panganib, source/date note.</desc>
