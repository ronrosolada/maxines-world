  <title id="svg-title-gmrc-g3-q3-w05-d04-visual">Lesson visual: Iba't Ibang Paraan ng Pagsamba</title>
  <desc id="svg-desc-gmrc-g3-q3-w05-d04-visual">Illustration for Iba't Ibang Paraan ng Pagsamba. Naipakikita ang pananalig habang iginagalang ang sariling paniniwala at paniniwala ng iba. Hanapin ang pasasalamat, paggalang, gabay, at mabuting kilos. It shows: nagpapasalamat, gumagalang sa paraan ng pagsamba ng iba, humihingi ng gabay, gumagawa ng mabuti.</desc>
