  <title id="svg-title-filipino-g3-q4-w13-d01-visual">Lesson visual: Fely ay Tumatawa</title>
  <desc id="svg-desc-filipino-g3-q4-w13-d01-visual">Illustration for Fely ay Tumatawa. Natutukoy ang simuno at panaguri sa pangungusap na 'Si Fely  ay tumatawa.' Basahin ang bawat pangungusap at tukuyin ang simuno at panaguri. It shows: Si Fely / ay tumatawa., Ang kalan / ay umuusok., Si Gino / ay naghuhugas., Ang baso / ay napuno..</desc>
