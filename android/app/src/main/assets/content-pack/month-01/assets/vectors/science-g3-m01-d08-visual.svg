  <title id="svg-title-science-g3-m01-d08-visual">Lesson visual: Plant Parts and Jobs</title>
  <desc id="svg-desc-science-g3-m01-d08-visual">Illustration for Plant Parts and Jobs. Identify common plant parts and functions while recognizing variation. Tap each plant part and notice the job shown. It shows: roots take in water and anchor the plant, stems support the plant and carry water, leaves use light to make food.</desc>
