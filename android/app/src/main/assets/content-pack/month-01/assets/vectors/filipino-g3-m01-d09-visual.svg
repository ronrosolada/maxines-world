  <title id="svg-title-filipino-g3-m01-d09-visual">Lesson visual: Panghalip na Pamalit</title>
  <desc id="svg-desc-filipino-g3-m01-d09-visual">Illustration for Panghalip na Pamalit. Gamitin ang panghalip na may malinaw na tinutukoy. Suriin ang bawat halimbawa at basahin ang mga halimbawa. It shows: Si Mara ay nagbasa. Siya ay tahimik., Ang mga bata ay dumating. Sila ay masaya., Hawak ko ang aklat. Ito ay bago..</desc>
