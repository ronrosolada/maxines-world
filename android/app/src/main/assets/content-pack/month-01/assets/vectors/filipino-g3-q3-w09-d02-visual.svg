  <title id="svg-title-filipino-g3-q3-w09-d02-visual">Lesson visual: Lita ay Nagtatahi</title>
  <desc id="svg-desc-filipino-g3-q3-w09-d02-visual">Illustration for Lita ay Nagtatahi. Natutukoy ang simuno at panaguri sa pangungusap na 'Si Lita  ay nagtatahi.' Basahin ang bawat pangungusap at tukuyin ang simuno at panaguri. It shows: Si Lita / ay nagtatahi., Ang apoy / ay nagliliyab., Si Totoy / ay gumuguhit., Ang araw / ay sumisikat..</desc>
