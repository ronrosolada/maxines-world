<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="svg-title-araling-panlipunan-g3-m01-d02-visual svg-desc-araling-panlipunan-g3-m01-d02-visual">
  <title id="svg-title-araling-panlipunan-g3-m01-d02-visual">Lesson visual: Nasaan ang Lalawigan?</title>
  <desc id="svg-desc-araling-panlipunan-g3-m01-d02-visual">Illustration for Nasaan ang Lalawigan?. Gamitin ang hilaga, timog, silangan, kanluran, katabi, at pagitan sa kathang-isip na mapa. Hanapin ang tatlong halimbawa ng direksiyon, katabi, at pagitan. It shows: Bayan A ay nasa hilaga ng Bayan B., Ang ilog ay nasa gitna ng Bayan C at Bayan D., Ang baybayin ay nasa silangan ayon sa kompas..</desc>
