  <title id="svg-title-filipino-g3-q4-w12-d03-visual">Lesson visual: Ugat ng 'Nagluto'</title>
  <desc id="svg-desc-filipino-g3-q4-w12-d03-visual">Illustration for Ugat ng 'Nagluto'. Natutukoy ang salitang-ugat ng 'nagluto' at ng mga katulad na salita. Basahin ang bawat pares at hanapin ang payak na anyo. It shows: luto → nagluto, punta → pumunta, tawa → tumawa, bukas → bumukas.</desc>
