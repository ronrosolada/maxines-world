  <title id="svg-title-science-g3-q4-w08-d04-visual">Lesson visual: Windows Let Light Through</title>
  <desc id="svg-desc-science-g3-q4-w08-d04-visual">Illustration for Windows Let Light Through. Describe how windows let light through and how to protect our eyes. Tap each example and notice what light does. It shows: clear glass lets sunlight into a room, a flashlight helps someone see a path, look away when a light is too bright, a curtain blocks some light.</desc>
