<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="svg-title-makabansa-g3-q4-w06-d03-visual svg-desc-makabansa-g3-q4-w06-d03-visual">
  <title id="svg-title-makabansa-g3-q4-w06-d03-visual">Lesson visual: Pamumuhay sa Pamilihan</title>
  <desc id="svg-desc-makabansa-g3-q4-w06-d03-visual">Illustration for Pamumuhay sa Pamilihan. Naipaliliwanag kung paano nakaaapekto ang paligid sa pamumuhay sa pamilihan ng komunidad. Hanapin sa larawan ang mga gawain sa pamilihan. It shows: nagtitinda ng gulay na galing sa sakahan, bumibili ng isda para sa hapunan, nagpapalit ng produkto sa tamang bayad, gumagamit ng bayong sa pag-uwi ng binili.</desc>
