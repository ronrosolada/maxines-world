  <title id="svg-title-mathematics-g3-q2-w04-d02-visual">Lesson visual: Take-Away Trail</title>
  <desc id="svg-desc-mathematics-g3-q2-w04-d02-visual">Illustration for Take-Away Trail. Subtract numbers below 10,000 with or without regrouping. Tap each subtraction example and follow the place-value changes. It shows: 458 − 123 = 335, 700 − 245 = 455, 335 + 123 = 458, trade 1 hundred for 10 tens.</desc>
