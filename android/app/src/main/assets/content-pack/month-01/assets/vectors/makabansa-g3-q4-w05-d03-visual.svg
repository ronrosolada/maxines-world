<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="svg-title-makabansa-g3-q4-w05-d03-visual svg-desc-makabansa-g3-q4-w05-d03-visual">
  <title id="svg-title-makabansa-g3-q4-w05-d03-visual">Lesson visual: Pamumuhay sa Paaralan</title>
  <desc id="svg-desc-makabansa-g3-q4-w05-d03-visual">Illustration for Pamumuhay sa Paaralan. Naipaliliwanag kung paano nakaaapekto ang paligid sa pamumuhay sa paaralan ng komunidad. Hanapin ang mga larawang nagpapakita ng buhay sa paaralan. It shows: Puno sa bakuran na nagbibigay-lilim sa hintayan, Bintanang nagpapapasok ng hangin sa silid, Maayos na daan sa lugar na maputik kapag umuulan, Hardin na may gulay na tumutubo sa komunidad.</desc>
