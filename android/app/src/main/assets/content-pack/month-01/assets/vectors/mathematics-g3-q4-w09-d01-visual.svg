  <title id="svg-title-mathematics-g3-q4-w09-d01-visual">Lesson visual: Multiplying 9 by 4</title>
  <desc id="svg-desc-mathematics-g3-q4-w09-d01-visual">Illustration for Multiplying 9 by 4. Multiply 9 by 4 using equal groups and place value. Tap each dots model and count its equal groups. It shows: 9 groups of 4 = 36, 9 × 4 = 36, 4 + 4 + 4 + 4 + 4 + 4 + 4 + 4 + 4 = 36, estimate before solving.</desc>
