  <title id="svg-title-gmrc-g3-q3-w05-d05-visual">Lesson visual: Paggalang sa Kapwa · Q3 W05 D05</title>
  <desc id="svg-desc-gmrc-g3-q3-w05-d05-visual">Illustration for Paggalang sa Kapwa · Q3 W05 D05. Naipakikita ang paggalang sa salita, kilos, at pakikinig sa kapwa. Hanapin sa larawan ang mga halimbawa ng paggalang sa kapwa. It shows: nakikinig, nagsasabi ng po at opo kung angkop, humihingi ng pahintulot, gumagalang sa pagkakaiba.</desc>
