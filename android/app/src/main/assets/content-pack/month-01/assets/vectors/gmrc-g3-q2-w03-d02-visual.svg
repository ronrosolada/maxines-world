  <title id="svg-title-gmrc-g3-q2-w03-d02-visual">Lesson visual: Magalang sa Parke</title>
  <desc id="svg-desc-gmrc-g3-q2-w03-d02-visual">Illustration for Magalang sa Parke. Naipakikita ang paggalang sa salita, kilos, at pakikinig sa kapwa sa parke. Hanapin ang pakikinig, pahintulot, turn, at pag-iingat sa parke. It shows: nakikinig sa kasama, nagsasabi ng po at opo kung angkop, humihingi ng pahintulot bago sumali, gumagalang sa ibang naglalaro.</desc>
