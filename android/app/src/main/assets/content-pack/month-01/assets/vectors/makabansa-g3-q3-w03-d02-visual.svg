  <title id="svg-title-makabansa-g3-q3-w03-d02-visual">Lesson visual: Pagkakakilanlang Pilipino · Q3 W03 D02</title>
  <desc id="svg-desc-makabansa-g3-q3-w03-d02-visual">Illustration for Pagkakakilanlang Pilipino · Q3 W03 D02. Naiuugnay ang sariling katangian at karanasan sa pagiging Pilipino. Hanapin sa larawan ang mga halimbawa ng kultura at pagkakakilanlan. It shows: paggalang sa kapwa, pag-aalaga sa komunidad, pagpapahalaga sa wika, pakikilahok sa kultura.</desc>
