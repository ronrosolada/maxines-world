  <title id="svg-title-makabansa-g3-q3-w03-d02-visual">Lesson visual: Bahagi ng Pagkakakilanlan Ko</title>
  <desc id="svg-desc-makabansa-g3-q3-w03-d02-visual">Illustration for Bahagi ng Pagkakakilanlan Ko. Naiuugnay ang sariling karanasan sa mga bahagi ng pagkakakilanlang Pilipino. Hanapin ang wika, pagtutulungan, paggalang, at lokal na gawain. It shows: paggalang sa kapwa, pagtutulungan sa komunidad, paggamit ng salitang natutuhan sa bahay, pakikilahok sa lokal na gawain.</desc>
