  <title id="svg-title-science-g3-m01-d02-visual">Lesson visual: Materials Can Change</title>
  <desc id="svg-desc-science-g3-m01-d02-visual">Illustration for Materials Can Change. Observe safe examples of changes from heating or cooling. Tap each observation and identify the heat or cold that caused it. It shows: ice cube melts on a warm plate, water turns to ice in a freezer, wax becomes soft near warmth.</desc>
