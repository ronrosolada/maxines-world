<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="svg-title-makabansa-g3-q4-w06-d04-visual svg-desc-makabansa-g3-q4-w06-d04-visual">
  <title id="svg-title-makabansa-g3-q4-w06-d04-visual">Lesson visual: Pamumuhay sa Kabayanan</title>
  <desc id="svg-desc-makabansa-g3-q4-w06-d04-visual">Illustration for Pamumuhay sa Kabayanan. Naipaliliwanag kung paano nakaaapekto ang kabayanan sa kultura at pamumuhay ng komunidad. Hanapin sa larawan ang apat na ugnayan ng lugar at pamumuhay. It shows: pangingisda sa baybayin, pagsasaka sa kapatagan, disenyong angkop sa klima, pagkain mula sa lokal na ani.</desc>
