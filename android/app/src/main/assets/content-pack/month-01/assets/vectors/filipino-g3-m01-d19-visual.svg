<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="svg-title-filipino-g3-m01-d19-visual svg-desc-filipino-g3-m01-d19-visual">
  <title id="svg-title-filipino-g3-m01-d19-visual">Lesson visual: Paghinuha Mula sa Pahiwatig</title>
  <desc id="svg-desc-filipino-g3-m01-d19-visual">Illustration for Paghinuha Mula sa Pahiwatig. Bumuo ng makatwirang hinuha mula sa pahiwatig at kaugnay na kaalaman. Tingnan ang pahiwatig at hinuha sa bawat halimbawa. It shows: Basang payong at patak sa bintana—maaaring umuulan, Walang laman ang mangkok at busog ang pusa—maaaring kumain ito, May putik ang sapatos—maaaring dumaan sa basang lupa.</desc>
