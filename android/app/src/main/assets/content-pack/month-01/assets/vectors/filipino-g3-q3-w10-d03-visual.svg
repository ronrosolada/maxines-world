  <title id="svg-title-filipino-g3-q3-w10-d03-visual">Lesson visual: Talata: Ang Aming Barangay</title>
  <desc id="svg-desc-filipino-g3-q3-w10-d03-visual">Illustration for Talata: Ang Aming Barangay. Nakabubuo ng maikling talata tungkol sa aming barangay na malinaw ang paksa at mga detalye. Basahin ang mga bahagi at tukuyin ang papel ng bawat isa. It shows: ang aming barangay, Ang barangay namin ay malinis at maayos., Naglilinis ng kalye ang mga kabataan tuwing Sabado., Ipinagmamalaki namin ang aming barangay..</desc>
