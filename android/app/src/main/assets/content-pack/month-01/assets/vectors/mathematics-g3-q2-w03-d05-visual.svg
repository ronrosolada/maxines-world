  <title id="svg-title-mathematics-g3-q2-w03-d05-visual">Lesson visual: Adding 118 and 264</title>
  <desc id="svg-desc-mathematics-g3-q2-w03-d05-visual">Illustration for Adding 118 and 264. Add 118 and 264 using place value, with or without regrouping. Tap each stars example and follow the place-value addition. It shows: 118 + 264 = 382 stars, 4,260 + 2,380 = 6,640 stars, 10 ones trade for 1 ten, round the addends to estimate.</desc>
