  <title id="svg-title-filipino-g3-m01-d20-visual">Lesson visual: Pag-aalaga ng Hayop</title>
  <desc id="svg-desc-filipino-g3-m01-d20-visual">Illustration for Pag-aalaga ng Hayop. Pumili ng ligtas at responsableng paraan ng pag-aalaga sa kathang-isip na alagang hayop. Tingnan ang ligtas na paraan ng pag-aalaga. It shows: Malinis na tubig, Angkop na pagkain, Kumonsulta sa beterinaryo kapag may sakit.</desc>
