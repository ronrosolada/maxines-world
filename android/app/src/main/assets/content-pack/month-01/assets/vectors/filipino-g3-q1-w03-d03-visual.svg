  <title id="svg-title-filipino-g3-q1-w03-d03-visual">Lesson visual: Talata: Sabado ng Pamilya ni Ana</title>
  <desc id="svg-desc-filipino-g3-q1-w03-d03-visual">Illustration for Talata: Sabado ng Pamilya ni Ana. Nakabubuo ng maikling talata tungkol sa Sabado ng pamilya ni Ana na malinaw ang paksa at mga detalye. Tukuyin ang paksa, ideya, detalye, at wakas. It shows: ang Sabado ng pamilya ni Ana, Masaya ang pamilya ni Ana sa Sabado., Nagluluto ng adobo si Nanay habang naglilinis si Tatay., Sabay-sabay silang kumakain at nagkukuwentuhan..</desc>
