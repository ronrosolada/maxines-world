  <title id="svg-title-science-g3-q4-w08-d03-visual">Lesson visual: Shadows Block Light</title>
  <desc id="svg-desc-science-g3-q4-w08-d03-visual">Illustration for Shadows Block Light. Describe how shadows form when light is blocked and how to protect our eyes. Tap each example and notice what light does. It shows: a ball blocks lamp light and makes a dark shape, a flashlight sends light toward a wall, sunglasses reduce bright light reaching eyes, look away from a very bright beam.</desc>
