  <title id="svg-title-araling-panlipunan-g3-m01-d01-visual">Lesson visual: Detektib ng mga Simbolo sa Mapa</title>
  <desc id="svg-desc-araling-panlipunan-g3-m01-d01-visual">Illustration for Detektib ng mga Simbolo sa Mapa. Bigyang-kahulugan ang simbolo gamit ang pamagat, susi, direksiyon, at label ng kathang-isip na mapa. Suriin ang bawat halimbawa at basahin ang mga halimbawa. It shows: asul na guhit—ilog ayon sa legend, bituin—paaralan ayon sa legend, N—hilaga.</desc>
