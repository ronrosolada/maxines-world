  <desc id="svg-desc-english-g3-q3-w08-d03-visual">Illustration for Silly, Warm, Quiet. Use the words silly, warm, and quiet in context with sentence clues. Tap each sentence that gives a clue for today’s words. It shows: The clown made a silly face., The blanket is warm on cold nights., The mouse is quiet in the corner., The silly puppy chased its tail..</desc>
