  <title id="svg-title-filipino-g3-q2-w06-d04-visual">Lesson visual: Bahagi ng Pangungusap · Q2 W06 D04</title>
  <desc id="svg-desc-filipino-g3-q2-w06-d04-visual">Illustration for Bahagi ng Pangungusap · Q2 W06 D04. Natutukoy ang simuno at panaguri sa payak na pangungusap. Tuklasin ang mga halimbawa. Hanapin ang simuno at panaguri. Magsimula sa 'Si Kiko / ay tumutugtog.'. It shows: Si Kiko / ay tumutugtog., Ang pagkain / ay mainit., Si Rosa / ay nag-eensayo., Ang pinto / ay nakabukas..</desc>
