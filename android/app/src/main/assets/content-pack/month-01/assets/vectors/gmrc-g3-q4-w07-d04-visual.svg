  <title id="svg-title-gmrc-g3-q4-w07-d04-visual">Lesson visual: Pananalig at Paggalang Review</title>
  <desc id="svg-desc-gmrc-g3-q4-w07-d04-visual">Illustration for Pananalig at Paggalang Review. Naipakikita ang pananalig habang iginagalang ang sariling paniniwala at paniniwala ng iba. Hanapin ang mga kilos ng pananalig at paggalang. It shows: nagpapasalamat sa kabutihang natanggap, nakikinig sa paniniwala ng iba, humihingi ng gabay sa nakatatanda, gumagawa ng mabuti nang walang pamimilit.</desc>
