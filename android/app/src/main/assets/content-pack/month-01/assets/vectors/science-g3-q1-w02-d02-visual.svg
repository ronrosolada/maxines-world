  <title id="svg-title-science-g3-q1-w02-d02-visual">Lesson visual: Sandpaper Detective</title>
  <desc id="svg-desc-science-g3-q1-w02-d02-visual">Illustration for Sandpaper Detective. Describe the observable properties of sandpaper and choose its safe use or handling. Tap each object and notice the property Milo describes. It shows: a wooden chair stays firm under a gentle touch, a cotton shirt feels soft, a plastic bottle keeps water inside, sandpaper feels rough.</desc>
