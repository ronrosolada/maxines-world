  <desc id="svg-desc-mathematics-g3-q3-w05-d02-visual">Illustration for Bar-Graph Scouts. Read a single bar graph and answer questions using its data. Tap the graph-reading examples in the picture! It shows: the tallest bar is greatest, the shortest bar is least, compare two categories, read the scale.</desc>
