<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="svg-title-araling-panlipunan-g3-m01-d13-visual svg-desc-araling-panlipunan-g3-m01-d13-visual">
  <title id="svg-title-araling-panlipunan-g3-m01-d13-visual">Lesson visual: Mga Sagisag ng Lalawigan at ang Kanilang Kuwento</title>
  <desc id="svg-desc-araling-panlipunan-g3-m01-d13-visual">Illustration for Mga Sagisag ng Lalawigan at ang Kanilang Kuwento. Suriin ang orihinal na kathang-isip na sagisag at ebidensya sa bawat elemento. Hanapin ang dahon, alon, at aklat kasama ang paliwanag ng mga ito. It shows: Dahon na ipinaliliwanag bilang sagisag ng kagubatan., Alon na kumakatawan sa anyong tubig ayon sa paliwanag., Aklat na kumakatawan sa pagkatuto ayon sa tala..</desc>
