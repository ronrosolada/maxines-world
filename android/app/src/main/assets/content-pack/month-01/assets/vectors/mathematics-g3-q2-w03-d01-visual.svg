  <title id="svg-title-mathematics-g3-q2-w03-d01-visual">Lesson visual: Capacity Lab</title>
  <desc id="svg-desc-mathematics-g3-q2-w03-d01-visual">Illustration for Capacity Lab. Measure capacity in liters or milliliters with an appropriate tool. Tap each container and decide which unit fits its capacity. It shows: a small water bottle, a large bucket, a kitchen measuring cup, a jerry can.</desc>
