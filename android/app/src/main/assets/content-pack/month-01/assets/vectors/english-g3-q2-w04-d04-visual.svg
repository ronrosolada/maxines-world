  <title id="svg-title-english-g3-q2-w04-d04-visual">Lesson visual: Telling and Asking Sentences</title>
  <desc id="svg-desc-english-g3-q2-w04-d04-visual">Illustration for Telling and Asking Sentences. Use a capital letter and the correct end mark in telling and asking sentences. Tap sentences with a capital and a matching end mark. It shows: Milo reads a book., Where is the pencil?, Look out for the wet floor!, We are ready to learn..</desc>
