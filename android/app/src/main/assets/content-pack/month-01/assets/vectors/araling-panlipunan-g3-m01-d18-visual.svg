  <title id="svg-title-araling-panlipunan-g3-m01-d18-visual">Lesson visual: Mga Tradisyon sa Paglipas ng Panahon</title>
  <desc id="svg-desc-araling-panlipunan-g3-m01-d18-visual">Illustration for Mga Tradisyon sa Paglipas ng Panahon. Ipaliwanag kung paano maaaring umangkop ang tradisyon habang nananatili ang kahulugan. Suriin ang bawat halimbawa at basahin ang mga halimbawa. It shows: festival changes schedule, recipe uses available ingredient, story retold in new medium.</desc>
