  <title id="svg-title-filipino-g3-q1-w03-d01-visual">Lesson visual: Talata: Ang Aking Pusa</title>
  <desc id="svg-desc-filipino-g3-q1-w03-d01-visual">Illustration for Talata: Ang Aking Pusa. Nakabubuo ng maikling talata tungkol sa aking pusa na malinaw ang paksa at mga detalye. Tukuyin ang paksa, ideya, detalye, at wakas. It shows: ang aking pusa, Ang aking pusa ay maputi at makapal ang balahibo., Mahilig siyang matulog sa ilalim ng mesa., Mahal na mahal ko ang aking pusa..</desc>
