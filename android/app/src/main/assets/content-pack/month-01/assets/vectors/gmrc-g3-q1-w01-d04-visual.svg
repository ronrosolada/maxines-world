  <title id="svg-title-gmrc-g3-q1-w01-d04-visual">Lesson visual: Pananalig at Paggalang</title>
  <desc id="svg-desc-gmrc-g3-q1-w01-d04-visual">Illustration for Pananalig at Paggalang. Naipakikita ang pananalig habang iginagalang ang sariling paniniwala at paniniwala ng iba. Hanapin ang pasasalamat, paggalang, gabay, at mabuting kilos. It shows: nagpapasalamat, gumagalang sa paniniwala ng iba, humihingi ng gabay, gumagawa ng mabuti.</desc>
