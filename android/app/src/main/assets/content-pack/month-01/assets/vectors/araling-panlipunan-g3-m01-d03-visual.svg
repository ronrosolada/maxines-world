  <title id="svg-title-araling-panlipunan-g3-m01-d03-visual">Lesson visual: Pagbasa ng mga Larawan ng Populasyon</title>
  <desc id="svg-desc-araling-panlipunan-g3-m01-d03-visual">Illustration for Pagbasa ng mga Larawan ng Populasyon. Basahin ang kathang-isip at may petsang datos sa pictotalangguhit o bar talangguhit. Hanapin ang halagang kinakatawan ng larawan at bar. It shows: Sa susi, 1 larawan ay katumbas ng 100 residente., Tatlong larawan ay katumbas ng 300 residente., Mas mataas ang bar na 500 kaysa bar na 300..</desc>
