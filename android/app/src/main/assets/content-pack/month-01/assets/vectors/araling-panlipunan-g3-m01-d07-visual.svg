  <title id="svg-title-araling-panlipunan-g3-m01-d07-visual">Lesson visual: Pagbasa ng Mapa ng mga Panganib</title>
  <desc id="svg-desc-araling-panlipunan-g3-m01-d07-visual">Illustration for Pagbasa ng Mapa ng mga Panganib. Basahin ang overlay ng mga panganib na ligtas para sa bata at sundin ang opisyal na gabay. Suriin ang bawat halimbawa at basahin ang mga halimbawa. It shows: bahang overlay, evacuation point ayon sa opisyal na mapa, makinig sa adult at awtoridad.</desc>
