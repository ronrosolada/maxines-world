<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="svg-title-araling-panlipunan-g3-m01-d07-visual svg-desc-araling-panlipunan-g3-m01-d07-visual">
  <title id="svg-title-araling-panlipunan-g3-m01-d07-visual">Lesson visual: Pagbasa ng Mapa ng mga Panganib</title>
  <desc id="svg-desc-araling-panlipunan-g3-m01-d07-visual">Illustration for Pagbasa ng Mapa ng mga Panganib. Basahin ang patong ng mga panganib na ligtas para sa bata at sundin ang opisyal na gabay. Hanapin ang marka ng baha, lugar ng paglikas, at opisyal na gabay. It shows: May kulay na patong sa lugar na maaaring bahain., May nakatalang lugar ng paglikas sa opisyal na mapa., Nakikinig ang bata sa nakatatanda at awtoridad kapag may babala..</desc>
