  <title id="svg-title-mathematics-g3-q1-w01-d02-visual">Lesson visual: Area Detectives</title>
  <desc id="svg-desc-mathematics-g3-q1-w01-d02-visual">Illustration for Area Detectives. Solve simple problems about the area of squares and rectangles using length × width. Tap each garden example and read the length × width clue. It shows: a 4-by-3 rectangle with 12 unit squares, a 5-by-2 rectangle with 10 unit squares, a square with 3 units on each side, a grid of unit squares inside a shape.</desc>
