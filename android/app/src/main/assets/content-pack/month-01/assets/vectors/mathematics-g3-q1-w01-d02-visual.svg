  <title id="svg-title-mathematics-g3-q1-w01-d02-visual">Lesson visual: Area Detectives</title>
  <desc id="svg-desc-mathematics-g3-q1-w01-d02-visual">Illustration for Area Detectives. Solve simple problems about the area of squares and rectangles using length × width. Tap each example and read the area fact. It shows: 4 × 3 = 12 square units, a 5 by 2 rectangle has 10 square units, a square has equal side lengths, counting unit squares checks the answer.</desc>
