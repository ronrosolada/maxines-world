<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="svg-title-gmrc-g3-q3-w05-d02-visual svg-desc-gmrc-g3-q3-w05-d02-visual">
  <title id="svg-title-gmrc-g3-q3-w05-d02-visual">Lesson visual: Pagmamalasakit</title>
  <desc id="svg-desc-gmrc-g3-q3-w05-d02-visual">Illustration for Pagmamalasakit. Naipakikita ang malasakit sa pamamagitan ng ligtas at kusang pagtulong. Hanapin ang pagtulong, pagbabahagi, pag-aalala, at pangangalaga. It shows: tumutulong sa kaklase, nagbabahagi ng gamit nang maayos, nagtatanong kung ayos lang ang kaibigan, nag-aalaga sa kapaligiran.</desc>
