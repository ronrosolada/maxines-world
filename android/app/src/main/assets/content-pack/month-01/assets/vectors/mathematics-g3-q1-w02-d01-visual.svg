  <title id="svg-title-mathematics-g3-q1-w02-d01-visual">Lesson visual: Place in Line</title>
  <desc id="svg-desc-mathematics-g3-q1-w02-d01-visual">Illustration for Place in Line. Read and use ordinal numbers up to the 100th to show position. Tap each runner card and say the place it shows. It shows: the 1st runner at the finish, the 2nd runner at the finish, the 10th runner in line, the 100th runner in line.</desc>
