  <desc id="svg-desc-english-g3-q2-w01-d01-visual">Illustration for Brave, Huge, Whisper. Use the words brave, huge, and whisper in context with sentence clues. Tap each sentence that gives a clue for brave, huge, or whisper. It shows: The brave dog saved the kitten from the rain., The elephant is huge, but it walks quietly., I whisper to my friend in the library., The new coin is shiny and clean..</desc>
