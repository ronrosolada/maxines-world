  <title id="svg-title-mathematics-g3-m01-d19-visual">Lesson visual: Division Fact Families</title>
  <desc id="svg-desc-mathematics-g3-m01-d19-visual">Illustration for Division Fact Families. Connect multiplication with sharing and grouping division. Tap each example and read the division. It shows: 12÷3=4, 12 shared among 3 gives 4 each, 12 grouped by 4 makes 3 groups.</desc>
