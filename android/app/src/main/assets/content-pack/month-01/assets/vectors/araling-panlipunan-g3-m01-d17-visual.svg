  <title id="svg-title-araling-panlipunan-g3-m01-d17-visual">Lesson visual: Kultura sa Araw-araw na Pamumuhay</title>
  <desc id="svg-desc-araling-panlipunan-g3-m01-d17-visual">Illustration for Kultura sa Araw-araw na Pamumuhay. Ihambing ang gawi nang may paggalang at walang pagraranggo. Suriin ang bawat halimbawa at basahin ang mga halimbawa. It shows: iba’t ibang pagbati, iba’t ibang pagkain, iba’t ibang wika.</desc>
