  <title id="svg-title-araling-panlipunan-g3-m01-d17-visual">Lesson visual: Kultura sa Araw-araw na Pamumuhay</title>
  <desc id="svg-desc-araling-panlipunan-g3-m01-d17-visual">Illustration for Kultura sa Araw-araw na Pamumuhay. Ihambing ang gawi nang may paggalang at walang pagraranggo. Hanapin ang halimbawa ng pagbati, pagkain, at wikang ginagamit sa pamayanan. It shows: May iba’t ibang pagbati sa magkakaibang pamilya., May iba’t ibang pagkaing inihahanda sa mga pagtitipon., May iba’t ibang wikang ginagamit sa pamayanan..</desc>
