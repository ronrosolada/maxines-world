  <desc id="svg-desc-science-g3-q4-w08-d01-visual">Illustration for Light and Sound Lab · Q4 W08 D01. Describe how light and sound behave and identify safe ways to protect people. Explore each example. a bell rings when shaken. a mirror reflects light. It shows: a bell rings when shaken, a mirror reflects light, turn on a lamp to read in a dark room, stay far from loud machines.</desc>
