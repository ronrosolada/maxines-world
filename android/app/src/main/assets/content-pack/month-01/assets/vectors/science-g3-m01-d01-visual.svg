  <title id="svg-title-science-g3-m01-d01-visual">Lesson visual: Material Detectives · M01 D01</title>
  <desc id="svg-desc-science-g3-m01-d01-visual">Illustration for Material Detectives · M01 D01. Classify familiar examples as solid, liquid, or gas using observable properties. Tap the stone, water, and air to compare their states. It shows: stone keeps its shape, water flows to fit its cup, air spreads through a balloon.</desc>
