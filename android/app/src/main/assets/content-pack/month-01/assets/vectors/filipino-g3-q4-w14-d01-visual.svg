  <title id="svg-title-filipino-g3-q4-w14-d01-visual">Lesson visual: Ines ay Sumisigaw</title>
  <desc id="svg-desc-filipino-g3-q4-w14-d01-visual">Illustration for Ines ay Sumisigaw. Natutukoy ang simuno at panaguri sa pangungusap na 'Si Ines  ay sumisigaw.' Basahin ang bawat pangungusap at tukuyin ang simuno at panaguri. It shows: Si Ines / ay sumisigaw., Ang tren / ay dumating., Si Ana / ay nagbabasa., Ang aso / ay tumatakbo..</desc>
