<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="svg-title-makabansa-g3-q4-w06-d02-visual svg-desc-makabansa-g3-q4-w06-d02-visual">
  <title id="svg-title-makabansa-g3-q4-w06-d02-visual">Lesson visual: Pamumuhay sa Siyudad</title>
  <desc id="svg-desc-makabansa-g3-q4-w06-d02-visual">Illustration for Pamumuhay sa Siyudad. Naipaliliwanag kung paano nakaaapekto ang siyudad sa kultura at pamumuhay ng komunidad. Hanapin sa larawan ang mga gawaing karaniwan sa siyudad. It shows: pagtatrabaho sa ospital, pagsakay sa tren papunta sa trabaho, pagtira sa gusaling maraming palapag, pagpunta sa paaralan sa gitna ng siyudad.</desc>
