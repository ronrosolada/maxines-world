  <desc id="svg-desc-filipino-g3-q1-w01-d04-visual">Illustration for Baybay: Paaralan. Naisusulat nang wasto ang salitang 'paaralan' at nagagamit ito sa pangungusap. Basahin ang baybay at kahulugan ng bawat salita. It shows: paaralan, kaibigan, paggalang, masipag.</desc>
