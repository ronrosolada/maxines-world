  <title id="svg-title-makabansa-g3-q4-w05-d01-visual">Lesson visual: Kapaligiran at Kultura · Q4 W05 D01</title>
  <desc id="svg-desc-makabansa-g3-q4-w05-d01-visual">Illustration for Kapaligiran at Kultura · Q4 W05 D01. Naipaliliwanag kung paano nakaaapekto ang kapaligiran sa kultura ng komunidad. Hanapin sa larawan ang mga halimbawa ng pamumuhay sa komunidad. It shows: pangingisda sa baybayin, pagsasaka sa kapatagan, disenyong angkop sa klima, pagkain mula sa lokal na ani.</desc>
