<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="svg-title-makabansa-g3-q4-w05-d01-visual svg-desc-makabansa-g3-q4-w05-d01-visual">
  <title id="svg-title-makabansa-g3-q4-w05-d01-visual">Lesson visual: Pamumuhay sa Kapatagan</title>
  <desc id="svg-desc-makabansa-g3-q4-w05-d01-visual">Illustration for Pamumuhay sa Kapatagan. Naipaliliwanag kung paano nakaaapekto ang kapatagan sa kultura at pamumuhay ng komunidad. Hanapin ang mga larawang nagpapakita ng buhay sa kapatagan. It shows: Malawak na palayan sa patag na lupain, Kanal na nagdadala ng tubig sa bukid, Karitong dumaraan sa tuwid na daan sa pagitan ng taniman, Pista pagkatapos ng anihan.</desc>
