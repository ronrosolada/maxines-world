  <title id="svg-title-araling-panlipunan-g3-m01-d10-visual">Lesson visual: Paano Nagsimula ang mga Lalawigan</title>
  <desc id="svg-desc-araling-panlipunan-g3-m01-d10-visual">Illustration for Paano Nagsimula ang mga Lalawigan. Ihiwalay ang tala, oral history, alamat, at di-beripikadong pahayag sa kathang-isip na pinagmulan. Suriin ang bawat halimbawa at basahin ang mga halimbawa. It shows: dated record, oral account na may attribution, legend na malinaw ang label.</desc>
