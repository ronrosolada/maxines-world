  <title id="svg-title-gmrc-g3-q2-w03-d03-visual">Lesson visual: Magalang sa Paaralan</title>
  <desc id="svg-desc-gmrc-g3-q2-w03-d03-visual">Illustration for Magalang sa Paaralan. Naipakikita ang paggalang sa salita, kilos, at pakikinig sa kapwa sa paaralan. Hanapin ang pakikinig, magalang na salita, pahintulot, at opinyon. It shows: nakikinig sa guro, nagsasabi ng po at opo kung angkop, humihingi ng pahintulot bago gumamit, gumagalang sa opinyon ng kaklase.</desc>
