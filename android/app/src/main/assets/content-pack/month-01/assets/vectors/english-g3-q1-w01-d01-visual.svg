<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
  <title id="title">Fiesta picture detective scene</title>
  <desc id="desc">A cheerful fiesta with a red flag, people dancing, food on a table, children laughing, a band playing, streamers on the street, a parade, and lanterns.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF1C7"/>
      <stop offset="1" stop-color="#FFFDF5"/>
    </linearGradient>
    <linearGradient id="street" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6D6A8"/>
      <stop offset="1" stop-color="#E9B98A"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="38" fill="url(#sky)"/>
  <path d="M0 308 Q160 280 320 310 T640 302 T800 310 V450 H0Z" fill="url(#street)"/>
  <path d="M0 357 Q150 335 300 360 T600 356 T800 360" fill="none" stroke="#D79B70" stroke-width="5" opacity=".65"/>

  <!-- streamers on the street -->
  <path d="M35 74 C170 20 305 112 440 65 S675 24 780 72" fill="none" stroke="#2E6F6D" stroke-width="4" stroke-linecap="round"/>
  <path d="M80 65 l-16 35 28-13 18 31 11-43z" fill="#E85D75" stroke="#8D4057" stroke-width="2"/>
  <path d="M185 58 l-12 39 27-17 16 34 13-46z" fill="#F2A65A" stroke="#A85D31" stroke-width="2"/>
  <path d="M298 73 l-8 39 25-20 19 32 8-44z" fill="#79B7D3" stroke="#346A88" stroke-width="2"/>
  <path d="M585 57 l-12 41 26-18 17 35 12-46z" fill="#F2A65A" stroke="#A85D31" stroke-width="2"/>
  <path d="M700 56 l-8 40 26-16 18 31 8-44z" fill="#E85D75" stroke="#8D4057" stroke-width="2"/>

  <!-- lanterns -->
  <g stroke="#2E6F6D" stroke-width="3">
    <path d="M145 44 v38 M128 59 h34"/>
    <path d="M145 66 q-18 15 0 31 q18-16 0-31z" fill="#F2A65A"/>
    <path d="M515 43 v42 M497 59 h36"/>
    <path d="M515 66 q-18 15 0 31 q18-16 0-31z" fill="#E85D75"/>
  </g>

  <!-- red flag -->
  <g id="red-flag">
    <path d="M70 112 V275" stroke="#6F4938" stroke-width="7" stroke-linecap="round"/>
    <path d="M73 118 C122 104 144 139 184 124 L184 190 C143 204 122 169 73 184Z" fill="#D94B55" stroke="#8E3039" stroke-width="3"/>
    <circle cx="95" cy="144" r="8" fill="#F7D154"/>
  </g>

  <!-- parade in the background -->
  <g id="parade" stroke="#2E6F6D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M240 268 h174 v-52 h-174z" fill="#79B7D3"/>
    <path d="M240 216 l22-30 22 30 22-30 22 30 22-30 22 30 22-30 22 30" fill="#E85D75"/>
    <circle cx="267" cy="270" r="20" fill="#FFFDF5"/>
    <circle cx="379" cy="270" r="20" fill="#FFFDF5"/>
    <path d="M267 290 v22 M379 290 v22"/>
    <circle cx="267" cy="253" r="9" fill="#F2A65A"/>
    <circle cx="379" cy="253" r="9" fill="#F2A65A"/>
  </g>

  <!-- people dancing -->
  <g id="dancing-people" stroke="#2E6F6D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="205" cy="181" r="19" fill="#F2A65A"/>
    <path d="M205 201 v67 M205 218 l-35-29 M205 218 l35-38 M205 268 l-24 42 M205 268 l28 38" fill="none"/>
    <circle cx="488" cy="180" r="19" fill="#C98262"/>
    <path d="M488 200 v68 M488 217 l-34-34 M488 217 l38-25 M488 268 l-29 40 M488 268 l29 40" fill="none"/>
    <path d="M186 177 q8 7 16 0 M469 176 q8 7 16 0" fill="none" stroke-width="3"/>
  </g>

  <!-- children laughing -->
  <g id="laughing-children" stroke="#2E6F6D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="142" cy="282" r="14" fill="#C98262"/>
    <path d="M142 297 v43 M142 309 l-23 18 M142 309 l23 18 M142 340 l-15 27 M142 340 l16 27" fill="none"/>
    <path d="M133 281 q9 8 18 0" fill="none" stroke-width="3"/>
    <circle cx="548" cy="278" r="14" fill="#F2A65A"/>
    <path d="M548 293 v45 M548 305 l-22 17 M548 305 l25 17 M548 338 l-15 28 M548 338 l16 28" fill="none"/>
    <path d="M539 277 q9 8 18 0" fill="none" stroke-width="3"/>
  </g>

  <!-- food on the table -->
  <g id="food-table" stroke="#2E6F6D" stroke-width="4" stroke-linejoin="round">
    <path d="M270 330 h190 l-18 28 H288Z" fill="#C98262"/>
    <path d="M292 358 l-12 64 M438 358 l12 64" fill="none" stroke="#6F4938" stroke-width="7" stroke-linecap="round"/>
    <ellipse cx="327" cy="316" rx="31" ry="14" fill="#FFFDF5"/>
    <path d="M304 312 q23-35 46 0" fill="#79B7D3"/>
    <ellipse cx="405" cy="315" rx="29" ry="13" fill="#FFFDF5"/>
    <circle cx="391" cy="312" r="8" fill="#E85D75"/>
    <circle cx="408" cy="309" r="8" fill="#F2A65A"/>
    <circle cx="423" cy="313" r="8" fill="#79B7D3"/>
    <path d="M355 303 q15-27 30 0" fill="none" stroke="#F2A65A" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- band playing -->
  <g id="band-playing" stroke="#2E6F6D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="638" cy="184" r="18" fill="#F2A65A"/>
    <path d="M638 203 v70 M638 222 l-33 24 M638 222 l31 25 M638 273 l-20 43 M638 273 l25 43" fill="none"/>
    <ellipse cx="690" cy="274" rx="28" ry="21" fill="#E85D75"/>
    <path d="M663 274 h54 M690 253 v42"/>
    <circle cx="688" cy="183" r="18" fill="#C98262"/>
    <path d="M688 202 v70 M688 220 l-30 25 M688 220 l34 20 M688 272 l-22 43 M688 272 l25 43" fill="none"/>
    <path d="M724 236 q33 18 2 42 l-13-5 8-32z" fill="#F2A65A"/>
  </g>

  <!-- small celebration accents -->
  <g fill="#F2A65A" stroke="#2E6F6D" stroke-width="2">
    <circle cx="235" cy="112" r="6"/>
    <circle cx="415" cy="128" r="7"/>
    <circle cx="655" cy="116" r="6"/>
    <path d="M755 173 l7 15 16 2-12 11 3 16-14-8-14 8 3-16-12-11 16-2z"/>
  </g>
</svg>
