<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="fiesta-title fiesta-desc">
  <title id="fiesta-title">The Fiesta Picture</title>
  <desc id="fiesta-desc">A bright town fiesta scene with a red flag, people dancing, food on a table, laughing children, a band playing, streamers across the street, a parade float, and hanging lanterns.</desc>
  <defs>
    <linearGradient id="fiesta-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9DDCF0"/>
      <stop offset="1" stop-color="#FFF1C7"/>
    </linearGradient>
    <linearGradient id="fiesta-road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6C978"/>
      <stop offset="1" stop-color="#D78E58"/>
    </linearGradient>
    <filter id="fiesta-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#173E4B" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Sunny town square -->
  <rect width="640" height="360" rx="20" fill="url(#fiesta-sky)"/>
  <circle cx="566" cy="66" r="30" fill="#FFD166" stroke="#173E4B" stroke-width="4"/>
  <path d="M0 116 Q80 78 160 116 T320 116 T480 116 T640 116" fill="#FFFDF4" opacity="0.9"/>
  <path d="M0 154 Q90 118 180 154 T360 154 T540 154 T720 154" fill="#FFFDF4" opacity="0.7"/>

  <!-- Town buildings -->
  <g id="town-buildings" stroke="#173E4B" stroke-width="4" stroke-linejoin="round">
    <path d="M0 158 L0 244 L132 244 L132 174 L68 132 Z" fill="#F29E8F"/>
    <path d="M508 174 L508 244 L640 244 L640 158 L572 132 Z" fill="#8CC7A5"/>
    <rect x="27" y="181" width="30" height="32" rx="4" fill="#FFE8A8"/>
    <rect x="82" y="181" width="30" height="32" rx="4" fill="#FFE8A8"/>
    <rect x="535" y="181" width="30" height="32" rx="4" fill="#FFE8A8"/>
    <rect x="590" y="181" width="30" height="32" rx="4" fill="#FFE8A8"/>
  </g>

  <!-- Streamers across the street -->
  <g id="streamers-on-street" fill="none" stroke-linecap="round" stroke-width="8">
    <path d="M12 42 Q100 94 190 42 T368 42 T546 42 T650 58" stroke="#E85D75"/>
    <path d="M8 64 Q98 116 188 64 T368 64 T548 64 T650 80" stroke="#F2B84B"/>
    <path d="M18 86 Q108 136 198 86 T378 86 T558 86 T646 102" stroke="#4BA3A2"/>
  </g>
  <g fill="#E85D75" stroke="#173E4B" stroke-width="2">
    <path d="M118 88 l18 28 l18 -35 z"/>
    <path d="M302 88 l18 28 l18 -35 z"/>
    <path d="M486 88 l18 28 l18 -35 z"/>
  </g>

  <!-- Red flag -->
  <g id="red-flag" aria-label="red flag" filter="url(#fiesta-shadow)">
    <line x1="54" y1="96" x2="54" y2="238" stroke="#173E4B" stroke-width="6" stroke-linecap="round"/>
    <path d="M58 101 L116 116 L58 140 Z" fill="#E84D5B" stroke="#173E4B" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="54" cy="96" r="7" fill="#FFD166" stroke="#173E4B" stroke-width="3"/>
  </g>

  <!-- Hanging lanterns -->
  <g id="lanterns" aria-label="lanterns" stroke="#173E4B" stroke-width="4" stroke-linejoin="round" filter="url(#fiesta-shadow)">
    <path d="M182 72 V112 M366 72 V112 M550 72 V112" fill="none"/>
    <path d="M166 112 Q182 100 198 112 L193 145 Q182 153 171 145 Z" fill="#F26B5B"/>
    <path d="M350 112 Q366 100 382 112 L377 145 Q366 153 355 145 Z" fill="#FFD166"/>
    <path d="M534 112 Q550 100 566 112 L561 145 Q550 153 539 145 Z" fill="#7BC8A4"/>
    <line x1="174" y1="151" x2="190" y2="151"/>
    <line x1="358" y1="151" x2="374" y2="151"/>
    <line x1="542" y1="151" x2="558" y2="151"/>
  </g>

  <!-- Fiesta title sign -->
  <g filter="url(#fiesta-shadow)">
    <path d="M244 112 L396 112 L386 158 L254 158 Z" fill="#FFF7D6" stroke="#173E4B" stroke-width="4"/>
    <text x="320" y="141" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="800" fill="#C95163">FIESTA DAY</text>
  </g>

  <!-- Ground and street -->
  <rect y="224" width="640" height="136" fill="#9FD08C"/>
  <path d="M0 270 Q160 238 320 270 T640 270 L640 360 L0 360 Z" fill="url(#fiesta-road)" stroke="#173E4B" stroke-width="4"/>
  <path d="M12 318 Q90 292 168 318 T324 318 T480 318 T648 318" fill="none" stroke="#F8D995" stroke-width="6" stroke-linecap="round" opacity="0.8"/>

  <!-- Parade float and banner -->
  <g id="parade" aria-label="parade" filter="url(#fiesta-shadow)" stroke="#173E4B" stroke-width="4" stroke-linejoin="round">
    <path d="M384 209 Q448 187 512 209 L512 222 L384 222 Z" fill="#E84D5B"/>
    <path d="M393 210 L420 186 L447 210 L474 186 L501 210" fill="none" stroke="#FFD166" stroke-width="8"/>
    <rect x="394" y="231" width="122" height="53" rx="12" fill="#F2A65A"/>
    <path d="M410 231 Q455 203 500 231" fill="#7BC8A4"/>
    <circle cx="416" cy="292" r="13" fill="#FFF7D6"/>
    <circle cx="493" cy="292" r="13" fill="#FFF7D6"/>
    <circle cx="416" cy="292" r="5" fill="#173E4B"/>
    <circle cx="493" cy="292" r="5" fill="#173E4B"/>
    <path d="M377 249 H349 M377 260 H340 M377 271 H349" stroke="#E84D5B" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- People dancing -->
  <g id="people-dancing" aria-label="people dancing" stroke="#173E4B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#fiesta-shadow)">
    <circle cx="156" cy="226" r="13" fill="#F2B38F"/>
    <path d="M156 240 L156 274 M156 248 L132 230 M156 248 L181 226 M156 274 L141 298 M156 274 L174 296" fill="none"/>
    <path d="M140 244 Q156 255 172 244" fill="#F26B5B"/>
    <circle cx="218" cy="218" r="13" fill="#E8A47F"/>
    <path d="M218 232 L218 268 M218 242 L193 225 M218 242 L244 230 M218 268 L202 296 M218 268 L237 290" fill="none"/>
    <path d="M202 236 Q218 247 234 236" fill="#4BA3A2"/>
    <path d="M131 230 Q145 214 158 230 M232 230 Q245 213 257 228" fill="none" stroke="#F2A65A" stroke-width="7"/>
  </g>

  <!-- Food on the table -->
  <g id="food-on-table" aria-label="food on the table" stroke="#173E4B" stroke-width="4" stroke-linejoin="round" filter="url(#fiesta-shadow)">
    <rect x="70" y="279" width="124" height="18" rx="8" fill="#B96B4B"/>
    <path d="M88 297 V339 M176 297 V339" fill="none"/>
    <ellipse cx="106" cy="273" rx="25" ry="10" fill="#FFF7D6"/>
    <ellipse cx="159" cy="273" rx="25" ry="10" fill="#FFF7D6"/>
    <circle cx="106" cy="270" r="7" fill="#E84D5B"/>
    <circle cx="159" cy="270" r="7" fill="#7BC8A4"/>
    <path d="M124 258 Q132 244 140 258 L140 272 L124 272 Z" fill="#F2A65A"/>
    <path d="M124 258 Q132 253 140 258" fill="none"/>
  </g>

  <!-- Children laughing -->
  <g id="children-laughing" aria-label="children laughing" stroke="#173E4B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#fiesta-shadow)">
    <circle cx="286" cy="253" r="13" fill="#F2B38F"/>
    <path d="M286 267 L286 301 M286 276 L267 289 M286 276 L305 289 M286 301 L274 326 M286 301 L298 326" fill="none"/>
    <path d="M274 270 Q286 280 298 270" fill="#FFD166"/>
    <path d="M280 255 Q286 261 292 255" fill="none" stroke="#C95163" stroke-width="3"/>
    <circle cx="330" cy="248" r="13" fill="#E8A47F"/>
    <path d="M330 262 L330 296 M330 272 L312 285 M330 272 L348 283 M330 296 L319 322 M330 296 L342 322" fill="none"/>
    <path d="M318 265 Q330 275 342 265" fill="#7BC8A4"/>
    <path d="M324 250 Q330 258 336 250" fill="none" stroke="#C95163" stroke-width="3"/>
    <path d="M269 240 Q286 226 303 240 M313 235 Q330 222 347 235" fill="none" stroke="#F2A65A" stroke-width="6"/>
  </g>

  <!-- Band playing -->
  <g id="band-playing" aria-label="band playing" stroke="#173E4B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#fiesta-shadow)">
    <circle cx="556" cy="229" r="12" fill="#F2B38F"/>
    <path d="M556 241 L556 275 M556 251 L535 262 M556 251 L580 245 M556 275 L545 302 M556 275 L568 302" fill="none"/>
    <path d="M543 244 Q556 254 569 244" fill="#E84D5B"/>
    <circle cx="604" cy="238" r="12" fill="#E8A47F"/>
    <path d="M604 250 L604 282 M604 260 L584 272 M604 260 L624 270 M604 282 L593 307 M604 282 L616 307" fill="none"/>
    <path d="M591 253 Q604 263 617 253" fill="#FFD166"/>
    <ellipse cx="515" cy="275" rx="24" ry="19" fill="#F2A65A"/>
    <ellipse cx="515" cy="275" rx="14" ry="11" fill="#FFD166"/>
    <path d="M534 267 Q558 253 579 262 Q588 267 578 272 L535 278" fill="#FFD166"/>
    <circle cx="581" cy="263" r="7" fill="#F2A65A"/>
  </g>

  <!-- Foreground street streamers -->
  <g id="street-streamers" fill="none" stroke-width="6" stroke-linecap="round">
    <path d="M224 342 Q252 322 280 342 T336 342" stroke="#E84D5B"/>
    <path d="M350 342 Q378 322 406 342 T462 342" stroke="#4BA3A2"/>
    <path d="M482 342 Q510 322 538 342 T594 342" stroke="#FFD166"/>
  </g>
</svg>
