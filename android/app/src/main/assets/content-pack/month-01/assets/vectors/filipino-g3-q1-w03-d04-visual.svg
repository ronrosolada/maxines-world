  <title id="svg-title-filipino-g3-q1-w03-d04-visual">Lesson visual: Maikling Buod · Q1 W03 D04</title>
  <desc id="svg-desc-filipino-g3-q1-w03-d04-visual">Illustration for Maikling Buod · Q1 W03 D04. Nakabubuo ng maikling buod ng tekstong naratibo. Basahin ang kuwento. Tukuyin ang tauhan, suliranin, pangyayari, at wakas. It shows: Lola Rosa, Milo, at Ana, Nawala ang alampay ni Lola Rosa., Hinanap ito nina Milo at Ana sa sala at sa kusina., Natagpuan nila ito sa ilalim ng unan..</desc>
