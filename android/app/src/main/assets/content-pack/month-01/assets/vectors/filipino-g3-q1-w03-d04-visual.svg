  <title id="svg-title-filipino-g3-q1-w03-d04-visual">Lesson visual: Buod: Ang Alampay ni Lola Rosa</title>
  <desc id="svg-desc-filipino-g3-q1-w03-d04-visual">Illustration for Buod: Ang Alampay ni Lola Rosa. Nakabubuo ng maikling buod ng kuwentong 'Ang Alampay ni Lola Rosa'. Tukuyin ang tauhan, suliranin, pangyayari, at wakas. It shows: Lola Rosa, Milo, at Ana, Nawala ang alampay ni Lola Rosa., Hinanap ito nina Milo at Ana sa sala at sa kusina., Natagpuan nila ito sa ilalim ng unan..</desc>
