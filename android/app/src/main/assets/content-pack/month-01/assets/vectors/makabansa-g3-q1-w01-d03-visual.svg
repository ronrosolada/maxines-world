  <title id="svg-title-makabansa-g3-q1-w01-d03-visual">Lesson visual: Kasaysayan ng Komunidad · Q1 W01 D03</title>
  <desc id="svg-desc-makabansa-g3-q1-w01-d03-visual">Illustration for Kasaysayan ng Komunidad · Q1 W01 D03. Natutukoy ang mahahalagang tao, lugar, at pangyayari sa kasaysayan ng komunidad. Hanapin sa larawan ang mga halimbawa ng kasaysayan ng komunidad. It shows: pamilihan, mga tindahan, bagong barangay hall, mga pamilya ngayon.</desc>
