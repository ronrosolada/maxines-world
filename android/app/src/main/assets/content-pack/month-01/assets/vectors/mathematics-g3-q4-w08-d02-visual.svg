  <title id="svg-title-mathematics-g3-q4-w08-d02-visual">Lesson visual: Multiplying 7 by 7</title>
  <desc id="svg-desc-mathematics-g3-q4-w08-d02-visual">Illustration for Multiplying 7 by 7. Multiply 7 by 7 using equal groups and place value. Tap each leaves model and count its equal groups. It shows: 7 groups of 7 = 49, 7 × 7 = 49, 7 + 7 + 7 + 7 + 7 + 7 + 7 = 49, estimate before solving.</desc>
