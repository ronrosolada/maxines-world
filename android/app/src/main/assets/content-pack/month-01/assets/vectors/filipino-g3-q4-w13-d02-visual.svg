  <desc id="svg-desc-filipino-g3-q4-w13-d02-visual">Illustration for Gino ay Naghuhugas. Natutukoy ang simuno at panaguri sa pangungusap na 'Si Gino  ay naghuhugas.' Basahin ang bawat pangungusap at tukuyin ang simuno at panaguri. It shows: Si Gino / ay naghuhugas., Ang baso / ay napuno., Si Hana / ay nagpapaaraw., Ang palengke / ay maingay..</desc>
