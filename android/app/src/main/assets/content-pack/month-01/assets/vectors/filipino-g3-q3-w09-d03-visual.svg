  <title id="svg-title-filipino-g3-q3-w09-d03-visual">Lesson visual: Totoy ay Gumuguhit</title>
  <desc id="svg-desc-filipino-g3-q3-w09-d03-visual">Illustration for Totoy ay Gumuguhit. Natutukoy ang simuno at panaguri sa pangungusap na 'Si Totoy  ay gumuguhit.' Basahin ang bawat pangungusap at tukuyin ang simuno at panaguri. It shows: Si Totoy / ay gumuguhit., Ang araw / ay sumisikat., Si Yana / ay nagkakanta., Ang puno / ay umuugoy..</desc>
