  <title id="svg-title-filipino-g3-m01-d11-visual">Lesson visual: Elemento ng Kuwento</title>
  <desc id="svg-desc-filipino-g3-m01-d11-visual">Illustration for Elemento ng Kuwento. Tukuyin ang tauhan, tagpuan, pangyayari, suliranin, at posibleng kalutasan. Tingnan ang elemento na inilalarawan sa bawat halimbawa. It shows: tauhan—gumaganap, tagpuan—lugar at panahon, pangyayari—naganap.</desc>
