  <desc id="svg-desc-filipino-g3-q2-w06-d02-visual">Illustration for Magalang na Pagbati sa Hapon. Nagagamit ang magagalang na pagbati at pananalita sa hapon. Basahin ang bawat pahayag at isipin kung kailan ito ginagamit. It shows: Magandang hapon po., Puwede po bang magtanong?, Walang anuman po., Patawad po..</desc>
