  <title id="svg-title-filipino-g3-q1-w01-d02-visual">Lesson visual: Milo ay Natututo</title>
  <desc id="svg-desc-filipino-g3-q1-w01-d02-visual">Illustration for Milo ay Natututo. Natutukoy ang simuno at panaguri sa pangungusap na 'Si Milo  ay natututo.' Basahin ang mga halimbawa at markahan ang hati. It shows: Si Milo / ay natututo., Ang mga bata / ay naglalaro., Ang guro / ay nagtuturo., Si Lolo / ay nagbabasa ng libro..</desc>
