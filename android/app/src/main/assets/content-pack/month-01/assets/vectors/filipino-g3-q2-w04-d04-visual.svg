  <title id="svg-title-filipino-g3-q2-w04-d04-visual">Lesson visual: Tito Ramon ay Nagtatanim</title>
  <desc id="svg-desc-filipino-g3-q2-w04-d04-visual">Illustration for Tito Ramon ay Nagtatanim. Natutukoy ang simuno at panaguri sa pangungusap na 'Si Tito Ramon  ay nagtatanim.' Basahin ang bawat pangungusap at tukuyin ang simuno at panaguri. It shows: Si Tito Ramon / ay nagtatanim., Ang mga dahon / ay nalalagas., Si Dina / ay nagwawalis., Ang sasakyan / ay humihinto sa tawiran..</desc>
