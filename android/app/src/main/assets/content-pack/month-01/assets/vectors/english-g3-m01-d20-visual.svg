  <desc id="svg-desc-english-g3-m01-d20-visual">Illustration for Read the Picture Graph · M01 D20. Interpret a pictograph using its title, categories, symbols, and key. Tap each graph part and read what it tells you. It shows: Key: one fruit icon = two votes, Three icons represent six votes, Compare categories using the same key.</desc>
