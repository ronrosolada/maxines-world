  <title id="svg-title-filipino-g3-q1-w02-d01-visual">Lesson visual: Tumatakbo pababa ang Bata</title>
  <desc id="svg-desc-filipino-g3-q1-w02-d01-visual">Illustration for Tumatakbo pababa ang Bata. Natutukoy ang simuno at panaguri sa pangungusap na 'Ang bata  ay tumatakbo pababa.' Basahin ang mga halimbawa at markahan ang hati. It shows: Ang bata / ay tumatakbo pababa., Si Nanay / ay nagluluto., Si Tatay / ay nagmamaneho., Ang bibe / ay lumalangoy sa lawa..</desc>
