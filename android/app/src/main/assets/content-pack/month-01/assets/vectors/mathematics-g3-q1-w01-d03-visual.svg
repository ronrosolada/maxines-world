  <title id="svg-title-mathematics-g3-q1-w01-d03-visual">Lesson visual: Point Detective Review</title>
  <desc id="svg-desc-mathematics-g3-q1-w01-d03-visual">Illustration for Point Detective Review. Recognize and describe points, lines, line segments, rays, and special line relationships. Tap a road mark, then count endpoints or arrows. It shows: a dot labeled K at the kite, a straight string with endpoints P and Q, a string beginning at R with one arrow, two strings that stay the same distance apart.</desc>
