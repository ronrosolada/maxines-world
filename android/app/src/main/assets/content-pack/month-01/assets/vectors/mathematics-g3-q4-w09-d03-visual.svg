  <title id="svg-title-mathematics-g3-q4-w09-d03-visual">Lesson visual: Fraction Models Review</title>
  <desc id="svg-desc-mathematics-g3-q4-w09-d03-visual">Illustration for Fraction Models Review. Represent fractions equal to one or greater than one using equal parts. Tap each model and count total and shaded parts. It shows: 3 of 3 equal star spaces shaded, 4 equal thirds counted, 5 of 5 equal boxes shaded, one strip split into equal parts.</desc>
