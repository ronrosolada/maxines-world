  <title id="svg-title-filipino-g3-q3-w10-d05-visual">Lesson visual: Munting Talata · Q3 W10 D05</title>
  <desc id="svg-desc-filipino-g3-q3-w10-d05-visual">Illustration for Munting Talata · Q3 W10 D05. Nakabubuo ng maikling talata na malinaw ang paksa at mga detalye. Tuklasin ang talata. Hanapin ang paksa, pangunahing ideya, detalye, at wakas. It shows: ang aso ni Milo, Ang aso ni Milo ay tapat at mapagmahal., Sumasalubong ito sa kanya tuwing uuwi siya., Kaya naman lagi siyang masaya sa kanyang aso..</desc>
