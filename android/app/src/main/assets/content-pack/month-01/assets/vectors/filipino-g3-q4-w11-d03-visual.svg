  <title id="svg-title-filipino-g3-q4-w11-d03-visual">Lesson visual: Bahagi ng Pangungusap · Q4 W11 D03</title>
  <desc id="svg-desc-filipino-g3-q4-w11-d03-visual">Illustration for Bahagi ng Pangungusap · Q4 W11 D03. Natutukoy ang simuno at panaguri sa payak na pangungusap. Tuklasin ang mga halimbawa. Hanapin ang simuno at panaguri. Magsimula sa 'Si Boy / ay naglalakad.'. It shows: Si Boy / ay naglalakad., Ang hangin / ay humihihip., Si Celia / ay naglilinis ng silid., Ang simbahan / ay umaalingawngaw..</desc>
