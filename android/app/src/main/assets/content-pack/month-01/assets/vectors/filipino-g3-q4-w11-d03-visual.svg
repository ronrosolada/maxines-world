  <title id="svg-title-filipino-g3-q4-w11-d03-visual">Lesson visual: Boy ay Naglalakad</title>
  <desc id="svg-desc-filipino-g3-q4-w11-d03-visual">Illustration for Boy ay Naglalakad. Natutukoy ang simuno at panaguri sa pangungusap na 'Si Boy  ay naglalakad.' Basahin ang bawat pangungusap at tukuyin ang simuno at panaguri. It shows: Si Boy / ay naglalakad., Ang hangin / ay humihihip., Si Celia / ay naglilinis ng silid., Ang simbahan / ay umaalingawngaw..</desc>
