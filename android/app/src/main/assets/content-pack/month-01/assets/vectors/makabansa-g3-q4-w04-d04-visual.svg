<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="svg-title-makabansa-g3-q4-w04-d04-visual svg-desc-makabansa-g3-q4-w04-d04-visual">
  <title id="svg-title-makabansa-g3-q4-w04-d04-visual">Lesson visual: Pamumuhay sa Tahanan</title>
  <desc id="svg-desc-makabansa-g3-q4-w04-d04-visual">Illustration for Pamumuhay sa Tahanan. Naipaliliwanag kung paano nakaaapekto ang paligid sa pamumuhay sa tahanan ng komunidad. Hanapin ang mga larawang nagpapakita ng tahanang umaangkop sa paligid. It shows: Bubong na matarik sa lugar na madalas umulan, Maluwang na bintana sa mainit na lugar, Sahig na mataas sa lugar na binabaha, Pagkaing niluluto mula sa ani sa paligid.</desc>
