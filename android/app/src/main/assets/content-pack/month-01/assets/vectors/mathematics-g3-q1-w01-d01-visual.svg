  <title id="svg-title-mathematics-g3-q1-w01-d01-visual">Lesson visual: Point Detective</title>
  <desc id="svg-desc-mathematics-g3-q1-w01-d01-visual">Illustration for Point Detective. Recognize and describe points, lines, line segments, rays, and special line relationships. Tap a mark, then count its endpoints or arrows. It shows: a dot labeled A, a straight path ending at B and C, a path starting at D with an arrow at one end, two straight paths that stay the same distance apart.</desc>
