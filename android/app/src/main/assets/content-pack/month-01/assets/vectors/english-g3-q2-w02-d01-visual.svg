  <title id="svg-title-english-g3-q2-w02-d01-visual">Lesson visual: Word Twins</title>
  <desc id="svg-desc-english-g3-q2-w02-d01-visual">Illustration for Word Twins. Identify synonyms and antonyms by comparing word meanings. Tap each pair that shows a word relationship. It shows: happy — glad, begin — start, hot — cold, early — late.</desc>
