  <desc id="svg-desc-filipino-g3-m01-d17-visual">Illustration for Paghahambing. Gumamit ng salitang naghahambing nang malinaw at patas. Suriin ang bawat halimbawa at basahin ang mga halimbawa. It shows: Parehong bilog ang dalawang plato., Mas mahaba ang pulang laso kaysa asul., Kapwa may dahon ang halaman..</desc>
