  <title id="svg-title-araling-panlipunan-g3-m01-d12-visual">Lesson visual: Kabuhayan at mga Kuwento ng Kasaysayan</title>
  <desc id="svg-desc-araling-panlipunan-g3-m01-d12-visual">Illustration for Kabuhayan at mga Kuwento ng Kasaysayan. Iugnay ang heograpiya sa posibleng kabuhayan nang walang stereotype. Suriin ang bawat halimbawa at basahin ang mga halimbawa. It shows: matabang lupa maaaring pagsakahan, baybayin maaaring suportahan turismo, lungsod may iba’t ibang trabaho.</desc>
