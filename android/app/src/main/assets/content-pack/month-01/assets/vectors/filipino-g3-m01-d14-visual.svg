  <desc id="svg-desc-filipino-g3-m01-d14-visual">Illustration for Mga Salitang Magkakatugma. Kilalanin ang mga salitang magkatugma batay sa hulihang tunog. Bigkasin ang dalawang salita at pakinggan ang hulihan. It shows: bahay at sabay, gabi at sabi, laro at taro.</desc>
