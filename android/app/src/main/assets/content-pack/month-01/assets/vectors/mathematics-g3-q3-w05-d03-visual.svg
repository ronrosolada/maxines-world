  <title id="svg-title-mathematics-g3-q3-w05-d03-visual">Lesson visual: Chance Check Review</title>
  <desc id="svg-desc-mathematics-g3-q3-w05-d03-visual">Illustration for Chance Check Review. Describe real-life outcomes as certain, likely, unlikely, or impossible. Tap each event and notice its clue about chance. It shows: the sun rises tomorrow — certain, rain follows dark clouds — likely, finding a pearl in one scoop — unlikely, a fish breathes on land — impossible.</desc>
