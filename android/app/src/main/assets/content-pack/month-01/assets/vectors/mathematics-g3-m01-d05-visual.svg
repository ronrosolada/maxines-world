  <desc id="svg-desc-mathematics-g3-m01-d05-visual">Illustration for Number Line-Up · M01 D05. Order whole numbers from least to greatest or greatest to least. Tap each example and read the order. It shows: 1,205 &lt; 1,250 &lt; 1,520, 4,000 &gt; 3,999, 2,310 comes before 2,301 in greatest-to-least order.</desc>
