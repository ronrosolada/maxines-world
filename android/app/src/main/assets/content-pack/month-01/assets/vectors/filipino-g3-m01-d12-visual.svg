  <title id="svg-title-filipino-g3-m01-d12-visual">Lesson visual: Muling Pagsasalaysay</title>
  <desc id="svg-desc-filipino-g3-m01-d12-visual">Illustration for Muling Pagsasalaysay. Isalaysay muli ang mahahalagang pangyayari sa sariling salita at tamang ayos. Suriin ang bawat halimbawa at basahin ang mga halimbawa. It shows: Una, tinupi ang dahon., Sumunod, inilagay sa tubig., Sa huli, lumutang ang bangka..</desc>
