  <title id="svg-title-mathematics-g3-q4-w09-d02-visual">Lesson visual: Fraction Models</title>
  <desc id="svg-desc-mathematics-g3-q4-w09-d02-visual">Illustration for Fraction Models. Represent fractions equal to one or greater than one using equal parts. Tap each model and count total and shaded parts. It shows: 3 of 3 equal cake slices shaded, 4 equal thirds counted, 5 of 5 equal squares shaded, one shape split into equal parts.</desc>
