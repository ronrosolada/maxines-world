  <desc id="svg-desc-science-g3-m01-d16-visual">Illustration for Motion from a Reference Point. Describe position and motion relative to a named reference point. Tap each example and read what it shows. It shows: ball moves away from cone, cart passes the tree, book stays beside box.</desc>
