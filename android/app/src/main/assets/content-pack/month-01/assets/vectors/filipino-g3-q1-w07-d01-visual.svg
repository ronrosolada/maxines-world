  <title id="svg-title-filipino-g3-q1-w07-d01-visual">Lesson visual: Malaki at Maliit na Letra at Bantas</title>
  <desc id="svg-desc-filipino-g3-q1-w07-d01-visual">Illustration for Malaki at Maliit na Letra at Bantas. Nagagamit ang malaki at maliit na letra at mga bantas sa pagsulat ng mga salita, parirala, at pangungusap. Tuklasin ang mga halimbawang kaugnay ng Malaki at Maliit na Letra at Bantas. It shows: sabado, pilipinas, araw, bansa, juan.</desc>
