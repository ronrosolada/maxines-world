  <desc id="svg-desc-english-g3-m01-d07-visual">Illustration for More Than One · M01 D07. Form regular plurals with -s or -es in taught examples. Tap each word pair and say the plural! It shows: cat → cats, box → boxes, dish → dishes.</desc>
