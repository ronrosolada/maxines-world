  <desc id="svg-desc-english-g3-q2-w05-d02-visual">Illustration for Smooth Reading. Read grade-level sentences accurately, smoothly, and with meaning. Tap the reading moves that make sentences smooth. It shows: pause at punctuation, read each word accurately, group words into phrases, change your voice for a question.</desc>
