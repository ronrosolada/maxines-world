<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="svg-title-filipino-g3-q1-w05-d01-visual svg-desc-filipino-g3-q1-w05-d01-visual">
  <title id="svg-title-filipino-g3-q1-w05-d01-visual">Lesson visual: Panghalip Panao (Ako, Ikaw, at Siya)</title>
  <desc id="svg-desc-filipino-g3-q1-w05-d01-visual">Illustration for Panghalip Panao (Ako, Ikaw, at Siya). Nakagagamit ng panghalip panao bilang pamalit sa pangngalan — ako, ikaw, at siya (F3WG-Ie-h-3). Tukuyin kung sino ang tinutukoy sa bawat sitwasyon. It shows: Nagsasalita ka tungkol sa iyong sarili, Kinakausap mo ang iyong kaklase, Pinag-uusapan ninyo ang inyong guro, Sinasabi mo ang iyong pangalan sa klase.</desc>
