  <title id="svg-title-filipino-g3-q1-w05-d01-visual">Lesson visual: Panghalip Panao (Ako, Ikaw, at Siya)</title>
  <desc id="svg-desc-filipino-g3-q1-w05-d01-visual">Illustration for Panghalip Panao (Ako, Ikaw, at Siya). Nakagagamit ng panghalip panao bilang pamalit sa pangngalan — ako, ikaw, at siya (F3WG-Ie-h-3). Tuklasin ang mga halimbawang kaugnay ng Panghalip Panao. It shows: Nagsasalita ka tungkol sa iyong sarili, Kinakausap mo ang iyong kaklase, Pinag-uusapan ninyo ang inyong guro, Sinasabi mo ang iyong pangalan sa klase.</desc>
