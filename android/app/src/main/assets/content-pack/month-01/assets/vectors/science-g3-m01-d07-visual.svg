  <title id="svg-title-science-g3-m01-d07-visual">Lesson visual: Why Animals Matter</title>
  <desc id="svg-desc-science-g3-m01-d07-visual">Illustration for Why Animals Matter. Describe selected ecosystem roles and humane relationships. Tap each animal and see how its action helps its home. It shows: a bee carries pollen between flowers, a worm loosens soil, a bird carries a seed to a new place.</desc>
