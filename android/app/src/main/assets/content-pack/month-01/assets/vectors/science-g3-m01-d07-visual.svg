  <title id="svg-title-science-g3-m01-d07-visual">Lesson visual: Why Animals Matter</title>
  <desc id="svg-desc-science-g3-m01-d07-visual">Illustration for Why Animals Matter. Describe selected ecosystem roles and humane relationships. Tap each example and read what it shows. It shows: bees can pollinate, worms can improve soil, some animals disperse seeds.</desc>
