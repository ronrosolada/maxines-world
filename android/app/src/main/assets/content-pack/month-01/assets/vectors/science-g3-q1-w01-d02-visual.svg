  <title id="svg-title-science-g3-q1-w01-d02-visual">Lesson visual: Wooden Ruler Detective</title>
  <desc id="svg-desc-science-g3-q1-w01-d02-visual">Illustration for Wooden Ruler Detective. Describe the observable properties of a wooden ruler and choose its safe use or handling. Tap each object and notice the property Milo describes. It shows: a metal spoon stays firm and reflects light, a rubber band bends and returns to shape, a paper towel soaks up water, a wooden ruler stays firm for measuring.</desc>
