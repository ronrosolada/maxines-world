  <title id="svg-title-filipino-g3-q1-w06-d02-visual">Lesson visual: Pagsasalaysay Muli ng Teksto</title>
  <desc id="svg-desc-filipino-g3-q1-w06-d02-visual">Illustration for Pagsasalaysay Muli ng Teksto. Natutukoy ang mahahalagang pangyayari at naiaayos ang mga ito ayon sa pagkakasunod-sunod sa isang napakinggang kuwento. Hanapin ang mga tanong na tutulong sa pagsasalaysay muli. It shows: Sino ang batang matalino at masayahin?, Ano ang pinakapaboritong iguhit ni Pam?, Ano ang hilig gawin ni Pam?, Saan siya gumuguhit?, Bakit siya naging mabait na bata?.</desc>
