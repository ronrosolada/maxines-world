  <title id="svg-title-english-g3-q2-w01-d03-visual">Lesson visual: Curious, Proud, Silent</title>
  <desc id="svg-desc-english-g3-q2-w01-d03-visual">Illustration for Curious, Proud, Silent. Use the words curious, proud, and silent in context with sentence clues. Tap each sentence that gives a clue for curious, proud, or silent. It shows: The curious boy asked many questions., Ana is proud of her neat handwriting., The library is silent during reading time., The tiny ant carried a big leaf..</desc>
