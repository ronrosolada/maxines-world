  <title id="svg-title-filipino-g3-q2-w04-d03-visual">Lesson visual: Bahagi ng Pangungusap · Q2 W04 D03</title>
  <desc id="svg-desc-filipino-g3-q2-w04-d03-visual">Illustration for Bahagi ng Pangungusap · Q2 W04 D03. Natutukoy ang simuno at panaguri sa payak na pangungusap. Tuklasin ang mga halimbawa. Hanapin ang simuno at panaguri. Magsimula sa 'Si Nena / ay nagdidilig.'. It shows: Si Nena / ay nagdidilig., Ang ulan / ay humihinto sa gabi., Si Tito Ramon / ay nagtatanim., Ang mga dahon / ay nalalagas..</desc>
