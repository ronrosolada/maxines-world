  <title id="svg-title-filipino-g3-q2-w04-d03-visual">Lesson visual: Nena ay Nagdidilig</title>
  <desc id="svg-desc-filipino-g3-q2-w04-d03-visual">Illustration for Nena ay Nagdidilig. Natutukoy ang simuno at panaguri sa pangungusap na 'Si Nena  ay nagdidilig.' Basahin ang bawat pangungusap at tukuyin ang simuno at panaguri. It shows: Si Nena / ay nagdidilig., Ang ulan / ay humihinto sa gabi., Si Tito Ramon / ay nagtatanim., Ang mga dahon / ay nalalagas..</desc>
