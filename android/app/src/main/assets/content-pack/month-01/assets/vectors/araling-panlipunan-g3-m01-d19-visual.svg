  <title id="svg-title-araling-panlipunan-g3-m01-d19-visual">Lesson visual: Mga Makasaysayang Lugar bilang Ebidensya</title>
  <desc id="svg-desc-araling-panlipunan-g3-m01-d19-visual">Illustration for Mga Makasaysayang Lugar bilang Ebidensya. Gamitin ang mapa, larawan, bagay, at salaysay upang ipaliwanag ang kahalagahan ng kathang-isip na site. Hanapin ang larawang may petsa, mapang may pinagmulan, at salaysay. It shows: Lumang larawang may petsa., Mapa na may nakatalang pinagmulan., Salaysay ng taong nakakita sa pangyayari..</desc>
