  <title id="svg-title-science-g3-q2-w04-d01-visual">Lesson visual: Frog and Bamboo</title>
  <desc id="svg-desc-science-g3-q2-w04-d01-visual">Illustration for Frog and Bamboo. Classify a frog and bamboo as living things and describe a basic need or body part. Tap each example and look for evidence of life. It shows: a frog grows and needs food, bamboo grows new stems and leaves, plant roots hold the bamboo in soil, a cup stays on a table.</desc>
