  <title id="svg-title-filipino-g3-m01-d01-visual">Lesson visual: Pangngalan sa Ating Mundo</title>
  <desc id="svg-desc-filipino-g3-m01-d01-visual">Illustration for Pangngalan sa Ating Mundo. Uriin ang pangngalan bilang tao, hayop, bagay, lugar, o pangyayari. Tingnan ang halimbawa ng pangngalan at pangkat nito. It shows: guro—tao, kalabaw—hayop, paaralan—lugar.</desc>
