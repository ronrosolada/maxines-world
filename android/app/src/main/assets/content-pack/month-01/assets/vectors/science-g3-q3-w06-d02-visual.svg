  <title id="svg-title-science-g3-q3-w06-d02-visual">Lesson visual: Crayon Detective</title>
  <desc id="svg-desc-science-g3-q3-w06-d02-visual">Illustration for Crayon Detective. Describe the observable properties of a crayon and choose its safe use or handling. Tap each object and notice the property Milo describes. It shows: a steel pan stays firm when pressed, a bamboo stick feels light and strong, tissue paper tears with a gentle pull, a crayon feels soft and waxy.</desc>
