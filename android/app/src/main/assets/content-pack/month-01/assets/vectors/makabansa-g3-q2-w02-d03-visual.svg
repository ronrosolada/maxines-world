<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="svg-title-makabansa-g3-q2-w02-d03-visual svg-desc-makabansa-g3-q2-w02-d03-visual">
  <title id="svg-title-makabansa-g3-q2-w02-d03-visual">Lesson visual: Maibabahagi Ko ang Pagka-Pilipino</title>
  <desc id="svg-desc-makabansa-g3-q2-w02-d03-visual">Illustration for Maibabahagi Ko ang Pagka-Pilipino. Naiuugnay ang sariling katangian sa pagbabahagi ng pagkakakilanlang Pilipino. Hanapin ang pagbati, pagkain, pista, at pangangalaga sa larawan. It shows: pagbati sa Filipino, pag-aalaga sa komunidad, pagpapahalaga sa lokal na pagkain, pakikilahok sa pista.</desc>
