  <title id="svg-title-science-g3-q1-w01-d05-visual">Lesson visual: Metal Key Detective</title>
  <desc id="svg-desc-science-g3-q1-w01-d05-visual">Illustration for Metal Key Detective. Describe the observable properties of a metal key and choose its safe use or handling. Tap each object and notice the property Milo describes. It shows: a rubber ball squishes and bounces back, denim feels thick and tough, wax paper does not soak up water, a metal key stays firm when pressed.</desc>
