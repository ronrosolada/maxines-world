<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="svg-title-araling-panlipunan-g3-m01-d06-visual svg-desc-araling-panlipunan-g3-m01-d06-visual">
  <title id="svg-title-araling-panlipunan-g3-m01-d06-visual">Lesson visual: Mahahalagang Anyong Lupa at Tubig</title>
  <desc id="svg-desc-araling-panlipunan-g3-m01-d06-visual">Illustration for Mahahalagang Anyong Lupa at Tubig. Ipaliwanag ang posibleng ugnayan ng anyong lupa/tubig sa pagkain, biyahe, habitat, at libangan. Hanapin ang ilog, kapatagan, at baybayin sa mga halimbawa. It shows: May bangkang maaaring dumaan sa ilog., May patag na lupa na maaaring taniman., May mga kabibe at halamang malapit sa baybayin..</desc>
