  <title id="svg-title-araling-panlipunan-g3-m01-d06-visual">Lesson visual: Mahahalagang Anyong Lupa at Tubig</title>
  <desc id="svg-desc-araling-panlipunan-g3-m01-d06-visual">Illustration for Mahahalagang Anyong Lupa at Tubig. Ipaliwanag ang posibleng ugnayan ng anyong lupa/tubig sa pagkain, biyahe, habitat, at libangan. Suriin ang bawat halimbawa at basahin ang mga halimbawa. It shows: ilog maaaring daanan, kapatagan maaaring sakahan, baybayin maaaring tirahan ng organism.</desc>
