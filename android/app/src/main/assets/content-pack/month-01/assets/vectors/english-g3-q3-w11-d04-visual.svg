  <title id="svg-title-english-g3-q3-w11-d04-visual">Lesson visual: Signal Words Review</title>
  <desc id="svg-desc-english-g3-q3-w11-d04-visual">Illustration for Signal Words Review. Identify words that show order, reason, contrast, or result in a text. Tap a word that connects ideas in each clue. It shows: first — tells what happens before, because — gives a reason, but — shows a contrast, so — shows a result.</desc>
