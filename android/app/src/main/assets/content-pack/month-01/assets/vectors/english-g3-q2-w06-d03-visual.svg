  <title id="svg-title-english-g3-q2-w06-d03-visual">Lesson visual: My Rainy Walk</title>
  <desc id="svg-desc-english-g3-q2-w06-d03-visual">Illustration for My Rainy Walk. Express an idea about a personal experience in clear sentences. Tap sentences that tell about Milo’s rainy walk. It shows: The rain began after school., I walked home with my yellow umbrella., I felt glad when Dad met me., I learned to check the sky before leaving..</desc>
