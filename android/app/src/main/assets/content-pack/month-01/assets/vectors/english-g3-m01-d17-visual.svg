  <title id="svg-title-english-g3-m01-d17-visual">Lesson visual: Cause-and-Effect Garden · M01 D17</title>
  <desc id="svg-desc-english-g3-m01-d17-visual">Illustration for Cause-and-Effect Garden · M01 D17. Distinguish cause from effect and connect them clearly. Tap each sentence and name the cause and effect. It shows: It rained, so the path became wet., The plant wilted because it lacked water., The bell rang, so learners lined up..</desc>
