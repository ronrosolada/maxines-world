  <title id="svg-title-filipino-g3-q3-w10-d04-visual">Lesson visual: Maikling Buod · Q3 W10 D04</title>
  <desc id="svg-desc-filipino-g3-q3-w10-d04-visual">Illustration for Maikling Buod · Q3 W10 D04. Nakabubuo ng maikling buod ng tekstong naratibo. Basahin ang kuwento. Tukuyin ang tauhan, suliranin, pangyayari, at wakas. It shows: Aling Rosa at Nena, Nabasag ang paso ng halaman ni Aling Rosa., Tinulungan ni Nena si Aling Rosa na magtanim ng bagong halaman., Natuwa si Aling Rosa sa kabaitan ni Nena..</desc>
