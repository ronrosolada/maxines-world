<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, initial-scale=1" />
<title>Maxine's World — Village Home (Playroom)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    /* -- Colorful DS structural tokens (radius / spacing / motion / elevation kept) -- */
    --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
    --space-5: 20px; --space-6: 24px; --space-8: 32px; --space-12: 48px;
    --radius-sm: 10px; --radius-md: 16px; --radius-lg: 24px; --radius-pill: 9999px;
    --elev-flat: none;
    --elev-ring: 0 0 0 1px var(--border);
    --elev-raised: 0 18px 40px rgba(24,59,74,0.16);
    --elev-soft: 0 10px 24px rgba(24,59,74,0.10);
    --motion-fast: 150ms; --motion-base: 240ms;
    --ease-standard: cubic-bezier(0.2,0,0,1);

    /* -- Village brand colors (explicit brief values — take precedence) -- */
    --teal: #087F83;
    --teal-deep: color-mix(in oklab, #087F83, black 10%);
    --gold: #F5B82E;
    --coral: #F47C6B;
    --green: #66A83E;
    --purple: #7653B5;
    --sky: #3C9DDB;
    --ink: #183B4A;
    --cream: #FFF7E8;
    --ph-flag-blue: #0038A8;
    --ph-flag-red: #CE1126;
    --ph-flag-gold: #FCD116;

    /* -- Semantic bindings (Colorful token names, brand values) -- */
    --bg: var(--cream);
    --surface: #FFFFFF;
    --surface-warm: var(--cream);
    --fg: var(--ink);
    --fg-2: color-mix(in oklab, var(--ink), white 30%);
    --muted: color-mix(in oklab, var(--ink), white 46%);
    --border: color-mix(in oklab, var(--ink), white 84%);
    --border-soft: color-mix(in oklab, var(--ink), white 90%);
    --accent: var(--teal);
    --accent-on: #FFFFFF;
    --accent-hover: color-mix(in oklab, var(--accent), black 8%);
    --accent-active: color-mix(in oklab, var(--accent), black 16%);
    --success: var(--green);
    --warn: var(--gold);
    --danger: #E5484D;
    --focus-ring: 0 0 0 4px rgba(8,127,131,0.32);

    --font-display: "Baloo 2", system-ui, sans-serif;
    --font-body: "Nunito", system-ui, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 1280px; height: 853px;
    overflow: hidden;
    font-family: var(--font-body);
    color: var(--fg);
  }
  button { font-family: inherit; }

  body {
    background:
      radial-gradient(circle at 14% 8%, rgba(255,255,255,0.35), rgba(255,255,255,0) 32%),
      radial-gradient(circle at 92% 88%, rgba(255,255,255,0.22), rgba(255,255,255,0) 30%),
      linear-gradient(135deg, var(--gold) 0%, var(--coral) 68%, var(--coral) 100%);
  }

  :focus-visible {
    outline: none;
    box-shadow: var(--focus-ring);
  }

  .app {
    width: 1280px; height: 853px;
    padding: 22px 30px 22px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    position: relative;
  }

  /* decorative flourish blobs — restrained, single system */
  .blob { position: absolute; border-radius: 50%; filter: blur(0px); opacity: 0.16; pointer-events: none; }
  .blob-1 { width: 220px; height: 220px; background: var(--purple); top: -70px; left: 620px; }
  .blob-2 { width: 160px; height: 160px; background: var(--sky); bottom: -50px; left: -40px; }

  /* ---------- HEADER ---------- */
  .topbar {
    height: 62px;
    background: rgba(255,255,255,0.92);
    border-radius: var(--radius-pill);
    box-shadow: var(--elev-soft);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 10px 0 10px;
    z-index: 2;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-badge {
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--teal);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 3px 0 var(--teal-deep);
    flex: none;
  }
  .brand-badge svg { width: 26px; height: 26px; }
  .brand-word { font-family: var(--font-display); font-weight: 800; font-size: 20px; letter-spacing: -0.01em; color: var(--ink); line-height: 1; }
  .brand-sub { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 3px; }

  .status-pills { display: flex; gap: 10px; padding-right: 6px; }
  .pill {
    display: flex; align-items: center; gap: 7px;
    height: 44px; padding: 0 16px 0 10px;
    border-radius: var(--radius-pill);
    font-weight: 800; font-size: 15px;
    line-height: 1;
  }
  .pill-icon { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex: none; }
  .pill-icon svg { width: 16px; height: 16px; }
  .pill-streak { background: color-mix(in oklab, var(--gold), white 78%); color: var(--ink); }
  .pill-streak .pill-icon { background: var(--gold); }
  .pill-streak .pill-icon svg { fill: var(--ink); }
  .pill-xp { background: color-mix(in oklab, var(--teal), white 84%); color: var(--ink); }
  .pill-xp .pill-icon { background: var(--teal); }
  .pill-xp .pill-icon svg { fill: #fff; }
  .pill-label { font-weight: 700; color: var(--muted); font-size: 12px; margin-left: 2px; }

  /* ---------- GREETING ---------- */
  .greeting {
    display: flex; align-items: center; justify-content: space-between;
    padding: 4px 14px 0 18px;
    z-index: 2;
    height: 128px;
  }
  .greeting-eyebrow { font-size: 14px; font-weight: 800; color: color-mix(in oklab, var(--ink), white 15%); margin: 0 0 2px; letter-spacing: 0.01em; }
  .greeting h1 {
    font-family: var(--font-display); font-weight: 800;
    font-size: 44px; line-height: 1.05; letter-spacing: -0.02em;
    color: var(--ink); margin: 0 0 6px;
    text-shadow: 0 2px 0 rgba(255,255,255,0.35);
  }
  .greeting-sub { font-size: 16px; font-weight: 700; color: color-mix(in oklab, var(--ink), white 25%); margin: 0; max-width: 480px; }

  .mascot-wrap { position: relative; display: flex; align-items: flex-end; gap: 14px; flex: none; }
  .speech-bubble {
    background: #fff; color: var(--ink); font-weight: 800; font-size: 14px;
    padding: 10px 16px; border-radius: 16px; border-bottom-right-radius: 4px;
    box-shadow: var(--elev-soft); max-width: 168px; margin-bottom: 30px;
  }
  .mascot-circle {
    width: 118px; height: 118px; border-radius: 50%;
    background: color-mix(in oklab, var(--cream), white 40%);
    box-shadow: var(--elev-soft);
    display: flex; align-items: center; justify-content: center;
    flex: none;
  }
  .mascot-circle svg { width: 108px; height: 108px; }

  /* ---------- ISLANDS GRID ---------- */
  .islands-grid {
    flex: 1 1 auto;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: 16px;
    z-index: 2;
  }
  .island {
    position: relative;
    display: flex; flex-direction: column; justify-content: center;
    text-align: left;
    border: none;
    border-radius: var(--radius-lg);
    padding: 18px 20px;
    cursor: pointer;
    box-shadow: var(--elev-soft);
    transition: transform var(--motion-base) var(--ease-standard), box-shadow var(--motion-base) var(--ease-standard);
    border: 2px solid transparent;
    color: var(--ink);
  }
  .island:hover { transform: translateY(-4px) scale(1.015); box-shadow: var(--elev-raised); }
  .island:active { transform: translateY(-1px) scale(1.0); }

  .island-badge {
    width: 52px; height: 52px; border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 10px;
    box-shadow: 0 3px 0 rgba(0,0,0,0.12);
  }
  .island-badge svg { width: 28px; height: 28px; fill: #fff; }
  .island-title { font-family: var(--font-display); font-weight: 800; font-size: 21px; margin: 0 0 3px; letter-spacing: -0.01em; }
  .island-sub { font-size: 13.5px; font-weight: 700; color: color-mix(in oklab, var(--ink), white 28%); margin: 0; }
  .island-arrow {
    position: absolute; right: 18px; bottom: 18px;
    width: 34px; height: 34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    transition: transform var(--motion-fast) var(--ease-standard);
  }
  .island-arrow svg { width: 16px; height: 16px; }
  .island:hover .island-arrow { transform: translateX(3px); }

  .island-story  { background: color-mix(in oklab, var(--purple) 16%, white); border-color: color-mix(in oklab, var(--purple) 38%, white); }
  .island-story  .island-badge { background: var(--purple); }
  .island-story  .island-arrow { background: color-mix(in oklab, var(--purple) 26%, white); }
  .island-story  .island-arrow svg { fill: var(--purple); }

  .island-numbers { background: color-mix(in oklab, var(--sky) 16%, white); border-color: color-mix(in oklab, var(--sky) 38%, white); }
  .island-numbers .island-badge { background: var(--sky); }
  .island-numbers .island-arrow { background: color-mix(in oklab, var(--sky) 26%, white); }
  .island-numbers .island-arrow svg { fill: var(--sky); }

  .island-kwentuhan { background: color-mix(in oklab, var(--coral) 18%, white); border-color: color-mix(in oklab, var(--coral) 40%, white); }
  .island-kwentuhan .island-badge { background: var(--coral); }
  .island-kwentuhan .island-arrow { background: color-mix(in oklab, var(--coral) 28%, white); }
  .island-kwentuhan .island-arrow svg { fill: var(--coral); }

  .island-discovery { background: color-mix(in oklab, var(--green) 18%, white); border-color: color-mix(in oklab, var(--green) 40%, white); }
  .island-discovery .island-badge { background: var(--green); }
  .island-discovery .island-arrow { background: color-mix(in oklab, var(--green) 28%, white); }
  .island-discovery .island-arrow svg { fill: var(--green); }

  .island-heritage { background: color-mix(in oklab, var(--gold) 22%, white); border-color: color-mix(in oklab, var(--gold) 46%, white); }
  .island-heritage .island-badge { background: var(--gold); }
  .island-heritage .island-badge svg { fill: var(--ink); }
  .island-heritage .island-arrow { background: color-mix(in oklab, var(--gold) 32%, white); }
  .island-heritage .island-arrow svg { fill: var(--ink); }

  .island-kindness { background: color-mix(in oklab, var(--teal) 16%, white); border-color: color-mix(in oklab, var(--teal) 36%, white); }
  .island-kindness .island-badge { background: var(--teal); }
  .island-kindness .island-arrow { background: color-mix(in oklab, var(--teal) 26%, white); }
  .island-kindness .island-arrow svg { fill: var(--teal); }

  .island.locked { cursor: not-allowed; filter: grayscale(0.72) saturate(0.55); }
  .island.locked:hover { transform: none; box-shadow: var(--elev-soft); }
  .island.locked .island-badge { position: relative; }
  .lock-chip {
    position: absolute; top: 16px; right: 16px;
    display: flex; align-items: center; gap: 6px;
    background: rgba(24,59,74,0.86); color: #fff;
    font-size: 12px; font-weight: 800;
    padding: 6px 10px 6px 8px; border-radius: var(--radius-pill);
  }
  .lock-chip svg { width: 13px; height: 13px; fill: #fff; }

  /* ---------- STICKER STRIP ---------- */
  .sticker-strip {
    background: rgba(255,255,255,0.92);
    border-radius: var(--radius-lg);
    padding: 12px 20px 14px;
    z-index: 2;
  }
  .sticker-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; }
  .sticker-head h2 { font-family: var(--font-display); font-size: 17px; font-weight: 800; margin: 0; color: var(--ink); }
  .sticker-count { font-size: 12.5px; font-weight: 800; color: var(--muted); }
  .sticker-row { display: flex; gap: 10px; }
  .sticker {
    width: 58px; height: 58px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    flex: none;
    box-shadow: 0 3px 0 rgba(0,0,0,0.10);
    border: none; cursor: default;
    transition: transform var(--motion-fast) var(--ease-standard);
  }
  .sticker svg { width: 30px; height: 30px; }
  .sticker:hover, .sticker:focus-visible { transform: rotate(-8deg) scale(1.12); }
  .sticker-empty {
    background: transparent;
    border: 2.5px dashed color-mix(in oklab, var(--ink), white 78%);
    box-shadow: none;
  }
  .sticker-empty:hover { transform: none; }

  /* ---------- QUEST BAR ---------- */
  .quest-bar {
    height: 62px;
    background: var(--ink);
    border-radius: var(--radius-lg);
    display: flex; align-items: center; gap: 18px;
    padding: 0 20px;
    z-index: 2;
  }
  .quest-icon { width: 34px; height: 34px; border-radius: 50%; background: var(--gold); display: flex; align-items: center; justify-content: center; flex: none; }
  .quest-icon svg { width: 18px; height: 18px; fill: var(--ink); }
  .quest-text { color: #fff; font-weight: 800; font-size: 16px; white-space: nowrap; }
  .quest-progress-label { color: color-mix(in oklab, #fff, transparent 30%); font-size: 12.5px; font-weight: 700; margin-left: -6px; }
  .quest-dots { display: flex; gap: 8px; margin-left: auto; }
  .quest-dot {
    width: 30px; height: 30px; border-radius: 50%;
    border: 2px solid color-mix(in oklab, #fff, transparent 55%);
    background: transparent;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: transform var(--motion-fast) var(--ease-standard), background var(--motion-fast) var(--ease-standard);
  }
  .quest-dot svg { width: 15px; height: 15px; fill: color-mix(in oklab, #fff, transparent 60%); }
  .quest-dot.filled { background: var(--gold); border-color: var(--gold); }
  .quest-dot.filled svg { fill: var(--ink); }
  .quest-dot:hover { transform: scale(1.1); }
  .btn-start {
    height: 42px; padding: 0 24px;
    background: var(--teal);
    color: #fff; border: none; border-radius: var(--radius-pill);
    font-weight: 800; font-size: 15px; cursor: pointer;
    box-shadow: 0 3px 0 var(--teal-deep);
    transition: transform var(--motion-fast) var(--ease-standard), background var(--motion-fast) var(--ease-standard);
  }
  .btn-start:hover { background: var(--accent-hover); transform: translateY(-1px); }
  .btn-start:active { transform: translateY(1px); box-shadow: 0 1px 0 var(--teal-deep); }

  /* ---------- MODAL ---------- */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(24,59,74,0.58);
    display: none; align-items: center; justify-content: center;
    z-index: 50;
  }
  .modal-overlay.open { display: flex; }
  .modal-card {
    width: 560px; max-height: 640px;
    background: #fff; border-radius: var(--radius-lg);
    box-shadow: var(--elev-raised);
    overflow: hidden;
    display: flex; flex-direction: column;
  }
  .modal-banner {
    height: 84px; display: flex; align-items: center; gap: 14px; padding: 0 24px;
    position: relative;
  }
  .modal-banner-badge { width: 52px; height: 52px; border-radius: 16px; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 0 rgba(0,0,0,0.14); }
  .modal-banner-badge svg { width: 28px; height: 28px; fill: #fff; }
  .modal-banner-title { font-family: var(--font-display); font-weight: 800; font-size: 20px; color: #fff; }
  .modal-banner-kicker { font-size: 12px; font-weight: 800; color: rgba(255,255,255,0.85); text-transform: uppercase; letter-spacing: 0.06em; }
  .modal-close {
    position: absolute; top: 14px; right: 14px;
    width: 32px; height: 32px; border-radius: 50%;
    background: rgba(255,255,255,0.28); border: none; color: #fff;
    font-size: 18px; line-height: 1; cursor: pointer; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
  }
  .modal-close:hover { background: rgba(255,255,255,0.42); }
  .modal-body { padding: 20px 24px 24px; overflow-y: auto; }
  .modal-meta { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .meta-chip { font-size: 12px; font-weight: 800; background: var(--border-soft); color: var(--fg-2); padding: 5px 11px; border-radius: var(--radius-pill); }
  .modal-story-title { font-family: var(--font-display); font-weight: 700; font-size: 17px; margin: 0 0 8px; color: var(--ink); }
  .modal-excerpt { font-size: 15px; line-height: 1.6; color: var(--ink); margin: 0 0 10px; background: var(--cream); border-radius: var(--radius-md); padding: 14px 16px; }
  .modal-excerpt.fil { font-style: normal; }
  .modal-translate { font-size: 13.5px; line-height: 1.55; color: var(--fg-2); margin: 0 0 16px; }
  .modal-actions { display: flex; gap: 10px; margin-top: 6px; }
  .modal-btn-primary {
    flex: 1; height: 48px; border: none; border-radius: var(--radius-pill);
    color: #fff; font-weight: 800; font-size: 15px; cursor: pointer;
    transition: filter var(--motion-fast) var(--ease-standard);
  }
  .modal-btn-primary:hover { filter: brightness(1.06); }
  .modal-btn-secondary {
    height: 48px; padding: 0 18px; border-radius: var(--radius-pill);
    background: transparent; border: 2px solid var(--border); color: var(--fg-2);
    font-weight: 800; font-size: 14px; cursor: pointer;
  }
  .modal-btn-secondary:hover { border-color: var(--muted); }

  /* ---------- TOAST ---------- */
  .toast {
    position: fixed; left: 50%; bottom: 34px; transform: translate(-50%, 16px);
    background: var(--ink); color: #fff; font-weight: 700; font-size: 14px;
    padding: 12px 20px; border-radius: var(--radius-pill);
    box-shadow: var(--elev-raised);
    opacity: 0; pointer-events: none;
    transition: opacity var(--motion-base) var(--ease-standard), transform var(--motion-base) var(--ease-standard);
    z-index: 60;
    display: flex; align-items: center; gap: 9px;
  }
  .toast svg { width: 16px; height: 16px; fill: var(--gold); flex: none; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>

<div class="toast" id="toast"><svg viewBox="0 0 24 24"><use href="#ic-paw"/></svg><span id="toastText"></span></div>

<script>
(function () {
  var ACTIVITIES = {
    story: {
      color: 'var(--purple)', icon: 'ic-book', kicker: 'Story Time', title: 'Read with Owly',
      meta: ['Grade 3', 'Reading', '5 min'],
      storyTitle: '"The Little Seed That Waited"',
      excerpt: 'Deep in the garden, a tiny seed waited under the warm soil. "When will it be my turn to grow?" she whispered. Then one morning, sunlight peeked through and said, "Today, little seed. Today is your day."',
      note: 'Owly reads aloud with you, then asks three questions about the story to check what you remember.'
    },
    numbers: {
      color: 'var(--sky)', icon: 'ic-abacus', kicker: 'Number Fun', title: 'Count with Kiko',
      meta: ['Grade 3', 'Math', '5 min'],
      storyTitle: 'Skip Counting by 5s',
      excerpt: 'Kiko the fox hops down the path by 5s: 5, 10, 15, ___, 25, ___, 35. Can you fill in the missing hops before Kiko reaches the finish line?',
      note: 'Builds toward multiplication — 8 rounds, gets a little trickier each time.'
    },
    kwentuhan: {
      color: 'var(--coral)', icon: 'ic-chat', kicker: 'Kwentuhan', title: 'Ang Alamat ng Pinya',
      meta: ['Grade 3', 'Kwento', '6 min'],
      storyTitle: 'Ang Alamat ng Pinya (Legend of the Pineapple)',
      excerpt: 'Noong unang panahon, may isang batang babae na si Pina na ayaw tumulong sa kanyang ina. Isang araw, hinanap niya ang nawawalang sandok — at bigla, lumitaw ang isang bagong halaman na may maraming mata. Iyon ay ang unang pinya.',
      note: 'A Filipino folktale about a lazy girl turned into a fruit with many eyes — a gentle lesson in helping others.'
    },
    discovery: {
      color: 'var(--green)', icon: 'ic-leaf', kicker: 'Discovery', title: 'Bakit Umuulan?',
      meta: ['Grade 3', 'Science', '5 min'],
      storyTitle: 'Bakit Umuulan? (Why Does It Rain?)',
      excerpt: 'Ang tubig sa dagat at ilog ay umaakyat sa alapaap bilang singaw. Kapag lumamig ang singaw sa itaas, ito ay nagiging patak — at bumabagsak bilang ulan!',
      note: 'Explore the water cycle with Tutti through a hands-on drag-and-drop diagram.'
    },
    heritage: {
      color: 'var(--gold)', icon: 'ic-flag', kicker: 'Heritage', title: 'Ang Watawat ng Pilipinas',
      meta: ['Grade 3', 'Heritage', '4 min'],
      storyTitle: 'Ang Watawat ng Pilipinas (The Philippine Flag)',
      excerpt: 'Ang tatlong bituin ay kumakatawan sa Luzon, Visayas, at Mindanao. Ang araw na may walong sinag ay para sa walong lalawigang unang naghimagsik. Pula para sa tapang, asul para sa kapayapaan, puti para sa kalinisan.',
      note: 'Ends with a matching game: color the flag and place the stars in the right spots.'
    }
  };

  var modal = document.getElementById('activityModal');
  var banner = document.getElementById('modalBanner');
  var badge = document.getElementById('modalBadge');
  var badgeIcon = document.getElementById('modalBadgeIcon');
  var kicker = document.getElementById('modalKicker');
  var titleEl = document.getElementById('modalTitle');
  var body = document.getElementById('modalBody');
  var toast = document.getElementById('toast');
  var toastText = document.getElementById('toastText');
  var toastTimer = null;

  function showToast(msg) {
    toastText.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.classList.remove('show'); }, 2600);
  }

  function openModal(key) {
    var a = ACTIVITIES[key];
    if (!a) return;
    banner.style.background = a.color;
    badge.style.background = 'rgba(255,255,255,0.24)';
    badgeIcon.innerHTML = '<use href="#' + a.icon + '"/>';
    kicker.textContent = a.kicker;
    titleEl.textContent = a.title;
    body.innerHTML =
      '<div class="modal-meta">' + a.meta.map(function (m) { return '<span class="meta-chip">' + m + '</span>'; }).join('') + '</div>' +
      '<h4 class="modal-story-title">' + a.storyTitle + '</h4>' +
      '<p class="modal-excerpt fil">' + a.excerpt + '</p>' +
      '<p class="modal-translate">' + a.note + '</p>' +
      '<div class="modal-actions">' +
      '<button class="modal-btn-primary" style="background:' + a.color + '" id="modalStartBtn">Start Activity</button>' +
      '<button class="modal-btn-secondary" id="modalLaterBtn">Maybe Later</button>' +
      '</div>';
    modal.classList.add('open');

    document.getElementById('modalStartBtn').addEventListener('click', function () {
      modal.classList.remove('open');
      showToast('Loading ' + a.title + ' — have fun!');
    });
    document.getElementById('modalLaterBtn').addEventListener('click', closeModal);
  }

  function closeModal() { modal.classList.remove('open'); }

  document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
  modal.addEventListener('click', function (e) { if (e.target === modal) closeModal(); });

  document.querySelectorAll('.island').forEach(function (el) {
    el.addEventListener('click', function () {
      var key = el.getAttribute('data-activity');
      if (key === 'locked') {
        showToast('Kindness Island unlocks at Level 4 — keep collecting paw prints!');
        return;
      }
      openModal(key);
    });
  });

  var goal = 3;
  function updateQuestLabel() {
    var filled = document.querySelectorAll('.quest-dot.filled').length;
    var label = document.querySelector('[data-od-id="quest-progress-label"]');
    var count = Math.min(filled, goal);
    label.textContent = count + ' of ' + goal + ' collected';
    if (filled >= goal) {
      label.textContent = goal + ' of ' + goal + ' collected — quest complete!';
    }
  }

  document.querySelectorAll('.quest-dot').forEach(function (dot) {
    dot.addEventListener('click', function () {
      var wasComplete = document.querySelectorAll('.quest-dot.filled').length >= goal;
      dot.classList.toggle('filled');
      updateQuestLabel();
      var nowComplete = document.querySelectorAll('.quest-dot.filled').length >= goal;
      if (nowComplete && !wasComplete) {
        showToast('Quest complete! Great job today, Maxine!');
      }
    });
  });

  document.getElementById('quest-start-btn').addEventListener('click', function (e) {
    var btn = e.currentTarget;
    var original = btn.textContent;
    btn.textContent = 'Playing...';
    showToast('Quest started — finish an activity to earn a paw print!');
    setTimeout(function () { btn.textContent = original; }, 2000);
  });
})();
</script>
