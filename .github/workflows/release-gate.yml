name: Release gate

# Runs when a v* tag is pushed. Enforces that the release never ships
# unreviewed curriculum: verifyPlayableContent fails unless every playable
# lesson is educator-approved (educatorValidated=true + RELEASED).
#
# Approval workflow:
#   1. Human curriculum review of the pack (QA audit + sampling)
#   2. python3 android/tools/mark_lessons_reviewed.py
#   3. Commit + push
#   4. Push the release tag — this workflow must pass first
#
# This job does NOT build/upload the APK; it is the quality gate that must
# be green before a release is considered shippable.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

jobs:
  content-review-gate:
    name: Content review gate (all lessons educator-approved)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew
        working-directory: android

      - name: Verify all playable lessons are educator-reviewed
        run: ./gradlew :app:verifyPlayableContent --stacktrace
        working-directory: android
