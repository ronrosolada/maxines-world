name: Release gate

# Runs when a v* tag is pushed. Enforces the reviewed 237-video Quiz Arena
# manifest and builds an unsigned release candidate for local signing.
#
# Approval workflow:
#   1. Review the video assessment manifest and run its quality gate
#   2. Commit + push
#   3. Push the release tag — this workflow must pass first
#
# Signing remains a workstation-only operation because this repository has no
# GitHub signing secrets. The tag gate publishes the verified unsigned
# candidate as a workflow artifact; the signed APK attached to the GitHub
# release is produced locally from the user-level keystore.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

jobs:
  content-review-gate:
    name: Video assessment gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew
        working-directory: android

      - name: Verify reviewed video assessment manifest
        run: ./gradlew :app:verifyPlayableContent --stacktrace
        working-directory: android

      - name: Assemble unsigned release candidate
        run: ./gradlew :app:assembleRelease --stacktrace
        working-directory: android

      - name: Upload verified unsigned release candidate
        uses: actions/upload-artifact@v4
        with:
          name: maxines-world-${{ github.ref_name }}-unsigned-release
          path: |
            android/app/build/outputs/apk/release/app-release-unsigned.apk
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
