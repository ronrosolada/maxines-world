name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

jobs:
  content-integrity:
    name: Content integrity (349 lessons)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew
        working-directory: android

      - name: Run content integrity tests
        run: ./gradlew :core-content:testDebugUnitTest --stacktrace
        working-directory: android

      - name: Upload content test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-integrity-report
          path: android/core-content/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

  build:
    name: Assemble + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: content-integrity
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew
        working-directory: android

      - name: Assemble debug
        run: ./gradlew assembleDebug --stacktrace
        working-directory: android

      - name: Run all unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
        working-directory: android

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: '**/build/reports/tests/testDebugUnitTest/'
          if-no-files-found: ignore

  migration-tests:
    name: Migration tests (emulator, API ${{ matrix.api-level }})
    # Pin to 22.04: ubuntu-latest (24.04) runner images regressed KVM access,
    # which breaks the x86_64 emulator ("No compatible devices connected").
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api-level: [34]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew
        working-directory: android

      - name: Run migration tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          working-directory: android
          script: ./gradlew :core-database:connectedDebugAndroidTest :app:connectedDebugAndroidTest --stacktrace

      - name: Upload migration test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-test-report
          path: android/core-database/build/reports/androidTests/
          if-no-files-found: ignore
