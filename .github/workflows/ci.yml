name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

jobs:
  content-integrity:
    name: Content integrity (100 lessons)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew
        working-directory: android

      - name: Run content integrity tests
        run: ./gradlew :core-content:testDebugUnitTest --stacktrace
        working-directory: android

      - name: Upload content test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-integrity-report
          path: android/core-content/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

  build:
    name: Assemble + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: content-integrity
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew
        working-directory: android

      - name: Assemble debug
        run: ./gradlew assembleDebug --stacktrace
        working-directory: android

      - name: Run all unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
        working-directory: android

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: '**/build/reports/tests/testDebugUnitTest/'
          if-no-files-found: ignore
