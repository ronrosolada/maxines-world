name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

jobs:
  content-integrity:
    name: Content integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew
        working-directory: android

      - name: Run content integrity tests
        run: ./gradlew :core-content:testDebugUnitTest --stacktrace
        working-directory: android

      - name: Upload content test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-integrity-report
          path: android/core-content/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

  content-schema-assets:
    name: Video schema + catalog references
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate video checkpoint manifest
        run: python3 android/tools/validate_video_checkpoints.py

      - name: Validate skill graph manifest
        run: python3 android/tools/validate_skill_graph.py

      - name: Validate catalog parity across server and content manifests
        run: python3 android/tools/validate_catalog_parity.py

      - name: Audit media assessment uniqueness and explanations
        run: python3 android/tools/audit_media_assessment_uniqueness.py

      - name: Audit MC length and detail tells
        run: python3 android/tools/validate_mc_length_tells.py

      - name: Audit MC first-option / slot-position tells
        run: python3 android/tools/validate_mc_position_tells.py

  content-tooling-tests:
    name: Content tooling tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Python tooling tests
        run: PYTHONPATH=android:android/tools python3 -m unittest discover -s android/tools -p 'test_*.py' -v

  workflow-lint:
    name: GitHub Actions workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  build:
    name: Assemble, lint + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [content-integrity, content-schema-assets, content-tooling-tests, workflow-lint]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew
        working-directory: android

      - name: Assemble debug
        run: ./gradlew assembleDebug --stacktrace
        working-directory: android

      - name: Lint debug
        run: ./gradlew lintDebug --stacktrace
        working-directory: android

      - name: Assemble unsigned release
        run: ./gradlew assembleRelease --stacktrace
        working-directory: android

      - name: Run all unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
        working-directory: android

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: '**/build/reports/tests/testDebugUnitTest/'
          if-no-files-found: ignore

  migration-tests:
    name: Connected tests (emulator, API ${{ matrix.api-level }})
    # Pin to 22.04: ubuntu-latest (24.04) runner images regressed KVM access,
    # which breaks the x86_64 emulator ("No compatible devices connected").
    runs-on: ubuntu-22.04
    # A cold API 34 emulator plus the first multi-module Android test build
    # can exceed 30 minutes. Keep a bounded job, but leave enough room for
    # Gradle compilation after emulator startup.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [34]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew
        working-directory: android

      - name: Enable KVM for emulator
        # Hosted runners ship /dev/kvm but the runner user is not in the kvm
        # group (group is empty); without access the emulator runner falls back
        # to -accel off and the API 34 image never boots in time.
        run: |
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm

      - name: Prebuild connected-test artifacts
        # Build before booting the emulator. The first multi-module build can
        # take 15+ minutes; leaving the emulator idle during that work caused
        # API 34 to go offline before app tests started.
        run: ./gradlew :core-database:assembleDebug :core-database:assembleDebugAndroidTest :app:assembleDebug :app:assembleDebugAndroidTest :feature-auth:assembleDebug :feature-auth:assembleDebugAndroidTest :feature-child-home:assembleDebug :feature-child-home:assembleDebugAndroidTest :feature-rewards:assembleDebug :feature-rewards:assembleDebugAndroidTest :feature-lesson-player:assembleDebug :feature-lesson-player:assembleDebugAndroidTest --stacktrace --no-daemon --max-workers=1
        working-directory: android

      - name: Run connected tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          # The API 34 image needs about 9.83 GB for userdata after the
          # prebuilt test APKs are present. The hosted runner has limited free
          # space, so the pre-launch hook removes only disposable installer
          # data and unrelated toolchains not used by Android CI.
          disk-size: 8G
          force-avd-creation: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: android
          pre-emulator-launch-script: |
            sudo rm -rf /usr/local/lib/android/sdk/.temp
            rm -rf "${GRADLE_USER_HOME}/caches/build-cache-1"
            sudo rm -rf /opt/ghc /usr/share/dotnet /usr/local/share/powershell /opt/hostedtoolcache/CodeQL
            df -h /usr/local/lib/android/sdk "${HOME}"
          script: ./gradlew :core-database:connectedDebugAndroidTest :app:connectedDebugAndroidTest :feature-auth:connectedDebugAndroidTest :feature-child-home:connectedDebugAndroidTest :feature-rewards:connectedDebugAndroidTest :feature-lesson-player:connectedDebugAndroidTest --stacktrace --no-daemon --max-workers=1

      - name: Upload migration test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connected-test-reports
          path: |
            android/core-database/build/reports/androidTests/
            android/app/build/reports/androidTests/
            android/feature-auth/build/reports/androidTests/
            android/feature-child-home/build/reports/androidTests/
            android/feature-rewards/build/reports/androidTests/
            android/feature-lesson-player/build/reports/androidTests/
          if-no-files-found: ignore
